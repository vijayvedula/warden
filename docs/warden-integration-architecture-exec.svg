<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180">
  <defs>
    <style>
      .title   { font: 800 40px 'Segoe UI', Arial, sans-serif; fill:#ffffff; }
      .tag      { font: 700 14px 'Segoe UI', Arial, sans-serif; fill:#ffffff; letter-spacing:1.5px; }
      .tagline { font: 400 19px 'Segoe UI', Arial, sans-serif; fill:#d8e2f2; }
      .sec      { font: 700 14px 'Segoe UI', Arial, sans-serif; fill:#51607a; letter-spacing:2px; }
      .h        { font: 700 18px 'Segoe UI', Arial, sans-serif; fill:#16243f; }
      .h2       { font: 700 15px 'Segoe UI', Arial, sans-serif; fill:#16243f; }
      .hw       { font: 700 21px 'Segoe UI', Arial, sans-serif; fill:#ffffff; }
      .body     { font: 400 14px 'Segoe UI', Arial, sans-serif; fill:#28384f; }
      .bodyw    { font: 400 14px 'Segoe UI', Arial, sans-serif; fill:#c9d4ea; }
      .small    { font: 400 13px 'Segoe UI', Arial, sans-serif; fill:#46566e; }
      .smallw   { font: 400 13px 'Segoe UI', Arial, sans-serif; fill:#d2dcec; }
      .pill     { font: 600 14px 'Segoe UI', Arial, sans-serif; fill:#16243f; }
      .step     { font: 800 16px 'Segoe UI', Arial, sans-serif; fill:#ffffff; }
      .c { text-anchor:middle; dominant-baseline:middle; }
      .lane     { fill:#f5f8fc; stroke:#cdd8e8; stroke-width:1.5; }
      .ptile    { fill:#ffffff; stroke:#c6d2e4; stroke-width:1.4; }
      .warden   { fill:#33417a; }
      .whdr     { fill:#232e5c; }
      .ipoint   { fill:#0f7d72; }
      .ext      { fill:#e9eff7; stroke:#c6d2e4; stroke-width:1.5; }
      .vcard    { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.4; }
      .rail     { fill:#f4f7fb; stroke:#d3dce8; stroke-width:1.6; }
      .keep     { fill:#eaf5f3; stroke:#9ed3cb; stroke-width:1.5; }
      .flow { stroke:#16243f; stroke-width:2.6; fill:none; }
      .tflow { stroke:#0f7d72; stroke-width:2.6; fill:none; }
    </style>
    <marker id="a" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L11,4.5 L0,9 z" fill="#16243f"/></marker>
    <marker id="at" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L11,4.5 L0,9 z" fill="#0f7d72"/></marker>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.18"/></filter>
  </defs>

  <rect width="2000" height="1180" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="2000" height="122" fill="#16243f"/>
  <text x="60" y="56" class="title">Warden Integration Architecture — Plugging Into Your Agent Platforms</text>
  <text x="62" y="92" class="tagline">Keep your identity. Point your MCP client at Warden. Stream audit, approvals &amp; revocation into your existing SOC / ITSM. Live in days — not a re-platform.</text>
  <rect x="1640" y="34" width="300" height="54" rx="6" fill="none" stroke="#5b6c92" stroke-width="1.6"/>
  <text x="1790" y="55" class="tag c">INTEGRATION VIEW</text>
  <text x="1790" y="74" class="bodyw c">for CTO · CIO · Enterprise Architecture</text>

  <!-- ============ LEFT: integration stack (x 60 .. 1320) ============ -->

  <!-- Lane 1: platforms + identity (unchanged) -->
  <text x="60" y="160" class="sec">1 · YOUR PLATFORMS &amp; IDENTITY  —  UNCHANGED</text>
  <rect x="60" y="172" width="1260" height="132" rx="10" class="lane" filter="url(#sh)"/>
  <rect x="80"  y="192" width="232" height="50" rx="6" class="ptile"/><text x="196" y="217" class="pill c">Bedrock AgentCore</text>
  <rect x="324" y="192" width="232" height="50" rx="6" class="ptile"/><text x="440" y="217" class="pill c">Vertex Agents</text>
  <rect x="568" y="192" width="232" height="50" rx="6" class="ptile"/><text x="684" y="217" class="pill c">Databricks Mosaic AI</text>
  <rect x="812" y="192" width="232" height="50" rx="6" class="ptile"/><text x="928" y="217" class="pill c">Azure AI Foundry</text>
  <rect x="1056" y="192" width="244" height="50" rx="6" class="ptile"/><text x="1178" y="217" class="pill c">LangGraph / CrewAI</text>
  <rect x="80" y="256" width="1220" height="36" rx="6" class="keep"/>
  <text x="98" y="278" class="small"><tspan font-weight="700">Identity stays where it is</tspan> — AWS STS · Google IAM · Databricks OBO + Unity Catalog · Azure Entra · Okta / Auth0 (OIDC). No identity re-platforming.</text>

  <!-- Integration point 1 -->
  <rect x="60" y="320" width="1260" height="52" rx="8" class="ipoint" filter="url(#sh)"/>
  <circle cx="92" cy="346" r="15" fill="#ffffff"/><text x="92" y="347" class="c" font-weight="800" fill="#0f7d72" font-size="16">1</text>
  <text x="120" y="341" class="step">Identity adapter (thin SDK)</text>
  <text x="120" y="360" class="smallw">mints a standards-based token (RFC 8693) from your native credentials — STS / OBO / workload identity. One-time, owned by your identity team.</text>

  <path d="M690 372 L690 392" class="tflow" marker-end="url(#at)"/>

  <!-- Lane 2: Warden -->
  <rect x="60" y="392" width="1260" height="184" rx="12" class="warden" filter="url(#sh)"/>
  <rect x="60" y="392" width="1260" height="44" rx="12" class="whdr"/>
  <rect x="60" y="424" width="1260" height="14" class="whdr"/>
  <text x="80" y="421" class="hw">WARDEN · inserts on the MCP &amp; agent-to-agent boundary</text>
  <text x="1300" y="416" text-anchor="end" class="smallw">vendor-neutral · drop-in</text>
  <rect x="80" y="452" width="380" height="106" rx="8" fill="#ffffff" stroke="#c7cfe6"/>
  <text x="270" y="478" class="h2 c">Deploy as a Sidecar</text>
  <text x="270" y="503" class="small c">one Warden per agent / session</text>
  <text x="270" y="523" class="small c">surgical control &amp; revocation</text>
  <text x="270" y="543" class="small c">matches native &amp; hybrid runtimes</text>
  <rect x="476" y="452" width="380" height="106" rx="8" fill="#ffffff" stroke="#c7cfe6"/>
  <text x="666" y="478" class="h2 c">…or a Shared Gateway</text>
  <text x="666" y="503" class="small c">one Warden per agent fleet</text>
  <text x="666" y="523" class="small c">simplest to operate at scale</text>
  <text x="666" y="543" class="small c">fronts many agents / tenants</text>
  <rect x="872" y="452" width="428" height="106" rx="8" fill="#ffffff" stroke="#c7cfe6"/>
  <text x="1086" y="478" class="h2 c">Policy-as-code, from your Git / CI</text>
  <text x="1086" y="503" class="small c">RBAC · ABAC · ReBAC rules reviewed,</text>
  <text x="1086" y="523" class="small c">versioned &amp; promoted like any config.</text>
  <text x="1086" y="543" class="small c">Hot-reload (SIGHUP) — no redeploy.</text>

  <!-- Integration point 2 -->
  <rect x="60" y="592" width="1260" height="52" rx="8" class="ipoint" filter="url(#sh)"/>
  <circle cx="92" cy="618" r="15" fill="#ffffff"/><text x="92" y="619" class="c" font-weight="800" fill="#0f7d72" font-size="16">2</text>
  <text x="120" y="613" class="step">MCP / tool boundary</text>
  <text x="120" y="632" class="smallw">point your MCP client at Warden; it proxies your existing tool gateways — AgentCore Gateway · Unity Catalog functions · Vertex tools. No agent code change.</text>

  <path d="M690 644 L690 664" class="flow" marker-end="url(#a)"/>

  <!-- Lane 3: enterprise plumbing (connect out) -->
  <text x="60" y="688" class="sec">3 · YOUR ENTERPRISE PLUMBING  —  WARDEN CONNECTS OUT TO IT</text>
  <rect x="60" y="700" width="1260" height="150" rx="10" class="lane" filter="url(#sh)"/>
  <rect x="80"  y="722" width="290" height="110" rx="8" class="ext"/><text x="225" y="752" class="h2 c">SIEM / SOC</text><text x="225" y="780" class="small c">OCSF event sink (signed)</text><text x="225" y="800" class="small c">Splunk · Sentinel · Chronicle</text>
  <rect x="386" y="722" width="290" height="110" rx="8" class="ext"/><text x="531" y="752" class="h2 c">ITSM / ChatOps</text><text x="531" y="780" class="small c">human approval holds</text><text x="531" y="800" class="small c">ServiceNow · Slack · Teams</text>
  <rect x="692" y="722" width="290" height="110" rx="8" class="ext"/><text x="837" y="752" class="h2 c">Admin / Secrets</text><text x="837" y="780" class="small c">signed revocation feed</text><text x="837" y="800" class="small c">kill token / agent / person</text>
  <rect x="998" y="722" width="302" height="110" rx="8" class="ext"/><text x="1149" y="752" class="h2 c">WORM / Object store</text><text x="1149" y="780" class="small c">audit retention &amp; anchoring</text><text x="1149" y="800" class="small c">S3 Object Lock · immutable</text>

  <text x="60" y="888" class="small"><tspan font-weight="700" fill="#16243f">Integration point 3</tspan> — outbound only, via standards-based sinks: audit → SIEM (OCSF), signed signals → IdP/SSF (CAEP), approvals → ITSM/ChatOps. Fail-safe by default; high-assurance (blocking) optional. Owned by SecOps.</text>

  <!-- ============ RIGHT RAIL: per-platform mapping (x 1356..1940) ============ -->
  <rect x="1356" y="150" width="584" height="870" rx="12" class="rail" filter="url(#sh)"/>
  <rect x="1356" y="150" width="584" height="46" rx="12" fill="#0f7d72"/>
  <rect x="1356" y="178" width="584" height="18" fill="#0f7d72"/>
  <text x="1376" y="180" class="hw" font-size="19">Per-platform integration</text>

  <!-- cards -->
  <g>
    <rect x="1376" y="210" width="544" height="92" rx="8" class="vcard"/>
    <text x="1396" y="234" class="h2">Amazon Bedrock AgentCore</text>
    <text x="1396" y="257" class="small"><tspan font-weight="700">Token:</tspan> STS AssumeRole + session tags (AgentCore Identity).</text>
    <text x="1396" y="276" class="small"><tspan font-weight="700">Sits:</tspan> in front of AgentCore Gateway (MCP).</text>
    <text x="1396" y="295" class="small"><tspan font-weight="700">Adds:</tspan> holds · tamper-evident audit · accountability chain.</text>
  </g>
  <g>
    <rect x="1376" y="312" width="544" height="92" rx="8" class="vcard"/>
    <text x="1396" y="336" class="h2">Google Vertex Agents</text>
    <text x="1396" y="359" class="small"><tspan font-weight="700">Token:</tspan> IAM workload identity / OIDC.</text>
    <text x="1396" y="378" class="small"><tspan font-weight="700">Sits:</tspan> sidecar to ADK / Agent Engine; guards A2A hops.</text>
    <text x="1396" y="397" class="small"><tspan font-weight="700">Adds:</tspan> human oversight · per-action proof to an IAM principal.</text>
  </g>
  <g>
    <rect x="1376" y="414" width="544" height="92" rx="8" class="vcard"/>
    <text x="1396" y="438" class="h2">Databricks Mosaic AI</text>
    <text x="1396" y="461" class="small"><tspan font-weight="700">Token:</tspan> on-behalf-of-user; Unity Catalog grants → relationships.</text>
    <text x="1396" y="480" class="small"><tspan font-weight="700">Sits:</tspan> MCP proxy in Model Serving / Databricks Apps.</text>
    <text x="1396" y="499" class="small"><tspan font-weight="700">Adds:</tspan> action-layer governance atop UC's data layer.</text>
  </g>
  <g>
    <rect x="1376" y="516" width="544" height="92" rx="8" class="vcard"/>
    <text x="1396" y="540" class="h2">Azure AI Foundry</text>
    <text x="1396" y="563" class="small"><tspan font-weight="700">Token:</tspan> Microsoft Entra managed identity.</text>
    <text x="1396" y="582" class="small"><tspan font-weight="700">Sits:</tspan> sidecar to Foundry agents.</text>
    <text x="1396" y="601" class="small"><tspan font-weight="700">Adds:</tspan> oversight · regulator-grade evidence.</text>
  </g>
  <g>
    <rect x="1376" y="618" width="544" height="92" rx="8" class="vcard"/>
    <text x="1396" y="642" class="h2">Self-hosted (LangGraph / CrewAI)</text>
    <text x="1396" y="665" class="small"><tspan font-weight="700">Token:</tspan> your OIDC (Okta / Auth0).</text>
    <text x="1396" y="684" class="small"><tspan font-weight="700">Sits:</tspan> sidecar; adapter wires tool calls through Warden.</text>
    <text x="1396" y="703" class="small"><tspan font-weight="700">Adds:</tspan> the full control plane these frameworks lack.</text>
  </g>

  <!-- what you build -->
  <rect x="1376" y="722" width="544" height="86" rx="8" class="keep"/>
  <text x="1396" y="748" class="h2">What you build vs. reuse</text>
  <text x="1396" y="772" class="small"><tspan font-weight="700">One thin adapter per platform</tspan> (pure data mapping). Everything</text>
  <text x="1396" y="791" class="small">else — proxy, policy, audit, revocation — is build-once &amp; portable.</text>

  <!-- timeline -->
  <rect x="1376" y="820" width="544" height="92" rx="8" fill="#eef3f9" stroke="#c6d2e4" stroke-width="1.4"/>
  <text x="1396" y="846" class="h2">Rollout</text>
  <text x="1396" y="870" class="small"><tspan font-weight="700">Weeks 1–2:</tspan> Observe — drop in, audit-only, zero behavior change.</text>
  <text x="1396" y="889" class="small"><tspan font-weight="700">Weeks 3–6:</tspan> Enforce policies + approval holds on high-risk tools.</text>
  <text x="1396" y="906" class="small" opacity="0.95"><tspan font-weight="700">Then:</tspan> Govern — revocation, retention &amp; compliance reporting.</text>

  <!-- bottom line -->
  <rect x="1376" y="924" width="544" height="80" rx="8" fill="#16243f"/>
  <text x="1396" y="952" class="hw" font-size="16">Net change to your stack</text>
  <text x="1396" y="977" class="smallw">one adapter + an MCP endpoint switch + outbound connectors</text>
  <text x="1396" y="996" class="smallw">you already operate. No re-platform of identity, agents, or tools.</text>

  <!-- Footer -->
  <rect x="0" y="1100" width="2000" height="80" fill="#16243f"/>
  <text x="60" y="1138" class="hw" font-size="18">Three integration points, three owners:</text>
  <text x="430" y="1139" class="bodyw"> ① Identity team (adapter)   ② Agent-platform team (MCP switch)   ③ SecOps (audit / approvals / revocation).</text>
  <text x="60" y="1164" class="bodyw">Warden sits between your agents and your tools — it does not replace your platform, your identity, or your systems of record.</text>
</svg>
