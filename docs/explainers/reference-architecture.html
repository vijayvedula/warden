<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Warden - Reference Architecture - an animated explainer</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#14181f; --ink:#e9ecf2; --muted:#878ea0;
    --blue:#5ec8e8; --gold:#ffd166; --green:#6ee7a8; --red:#ff6f6f;
    --amber:#f5a623; --purple:#b79cf6; --teal:#52d6c0; --line:#39414f;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --display:"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; min-height:100%; -webkit-font-smoothing:antialiased;}
  .topbar{width:100%; max-width:1180px; display:flex; align-items:baseline; justify-content:space-between; padding:18px 8px 10px; gap:12px;}
  .brand{font-family:var(--display); font-size:19px; letter-spacing:.3px}
  .brand b{color:var(--gold); font-weight:600}
  .tagline{color:var(--muted); font-size:13px; font-family:var(--mono)}
  .progress{width:100%; max-width:1180px; height:3px; background:#1a1f29; border-radius:3px; overflow:hidden}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--gold)); transition:width .4s ease}
  .stage{position:relative; width:min(100%, calc((100vh - 210px) * 16 / 9)); max-width:1180px; aspect-ratio:16/9; margin:14px 0 8px;
    border:1px solid #1d232e; border-radius:14px; overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%, #11161f 0%, var(--bg) 60%), radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
    background-size:auto, 26px 26px; box-shadow:0 30px 80px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03); cursor:pointer; user-select:none;}
  svg#viz{position:absolute; inset:0; width:100%; height:100%; display:block}
  #viz text{font-family:var(--sans); fill:var(--ink)}
  #viz text.mono{font-family:var(--mono)}
  #viz text.disp{font-family:var(--display)}
  #scene *{transform-box:fill-box; transform-origin:center}
  .chip{position:absolute; top:14px; left:16px; font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.4px;
    background:rgba(10,12,16,.6); border:1px solid #232a36; border-radius:999px; padding:5px 12px; backdrop-filter:blur(4px);}
  .chip b{color:var(--blue)}
  .cap{position:absolute; left:0; right:0; bottom:0; padding:20px 7% 24px; font-size:clamp(13px,1.6vw,20px); line-height:1.5; text-align:center;
    background:linear-gradient(0deg, rgba(7,9,12,.95) 32%, rgba(7,9,12,0)); min-height:80px; transition:opacity .45s ease; opacity:0;}
  .cap b{color:var(--ink); font-weight:600}
  .cap code{font-family:var(--mono); font-size:.92em; color:var(--blue); background:rgba(94,200,232,.1); padding:1px 6px; border-radius:5px}
  .cap .g{color:var(--gold)} .cap .b{color:var(--blue)} .cap .gr{color:var(--green)}
  .cap .r{color:var(--red)} .cap .p{color:var(--purple)} .cap .am{color:var(--amber)} .cap .t{color:var(--teal)}
  .controls{width:100%; max-width:1180px; display:flex; align-items:center; gap:14px; padding:8px 6px 22px; flex-wrap:wrap;}
  .btn{appearance:none; background:#161b24; color:var(--ink); border:1px solid #283040; width:42px; height:42px; border-radius:11px; font-size:16px; cursor:pointer; display:grid; place-items:center; transition:.15s;}
  .btn:hover{background:#1d2533; border-color:#3a455a}
  .btn.play{width:52px; height:52px; font-size:18px; background:#1b2330; border-color:#33415a}
  .dots{display:flex; gap:7px; flex:1; flex-wrap:wrap; align-items:center; justify-content:center}
  .dot{width:9px; height:9px; border-radius:50%; background:#2a3140; cursor:pointer; transition:.2s; border:none; padding:0}
  .dot:hover{background:#46506a}
  .dot.on{background:var(--gold); transform:scale(1.35); box-shadow:0 0 10px rgba(255,209,102,.5)}
  .scenelabel{font-family:var(--mono); font-size:12.5px; color:var(--muted); min-width:210px; text-align:right}
  .scenelabel b{color:var(--ink)}
  .hint{width:100%; max-width:1180px; text-align:center; color:#5c6475; font-size:12px; font-family:var(--mono); padding-bottom:30px}
  @media (max-width:640px){ .scenelabel{display:none} .tagline{display:none} }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><b>Warden</b> &mdash; Reference Architecture</div>
    <div class="tagline">for CTO &middot; CIO &middot; Enterprise Architecture</div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="stage" id="stage" title="click to advance">
    <svg id="viz" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ah" markerWidth="11" markerHeight="11" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/>
        </marker>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="scene"></g>
    </svg>
    <div class="chip" id="chip"></div>
    <div class="cap" id="cap"></div>
  </div>
  <div class="controls">
    <button class="btn" id="prev" title="previous (&larr;)">&#9664;</button>
    <button class="btn play" id="play" title="play / pause (space)">&#10073;&#10073;</button>
    <button class="btn" id="next" title="next (&rarr;)">&#9654;</button>
    <button class="btn" id="replay" title="replay scene (r)">&#8635;</button>
    <div class="dots" id="dots"></div>
    <div class="scenelabel" id="slabel"></div>
  </div>
  <div class="hint">space play/pause &nbsp;&middot;&nbsp; &larr; / &rarr; scenes &nbsp;&middot;&nbsp; r replay &nbsp;&middot;&nbsp; click canvas to advance</div>

<script>
const NS="http://www.w3.org/2000/svg";
const stage=document.getElementById("scene");
const capEl=document.getElementById("cap");
const chipEl=document.getElementById("chip");
function S(tag,attrs={},kids=[]){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs){ if(k==="text") n.textContent=attrs[k]; else n.setAttribute(k,attrs[k]); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c&&n.appendChild(c));
  return n;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function anim(node,frames,opts={}){
  const a=node.animate(frames,Object.assign({fill:"both",easing:"cubic-bezier(.42,0,.2,1)"},opts));
  return a.finished.catch(()=>{});
}
function fadeIn(node,{dur=600,delay=0,dy=14,dx=0}={}){
  return anim(node,[{opacity:0,transform:`translate(${dx}px,${dy}px)`},{opacity:1,transform:"translate(0,0)"}],{duration:dur,delay});
}
function pop(node,{dur=460,delay=0}={}){
  return anim(node,[{opacity:0,transform:"scale(.7)"},{opacity:1,transform:"scale(1)"}],{duration:dur,delay,easing:"cubic-bezier(.3,1.5,.5,1)"});
}
function drawOn(path,{dur=850,delay=0,ease="ease-in-out"}={}){
  const L=path.getTotalLength(); path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
  return anim(path,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:dur,delay,easing:ease});
}
function pulse(node,{scale=1.16,dur=900}={}){ return node.animate([{transform:"scale(1)"},{transform:`scale(${scale})`},{transform:"scale(1)"}],{duration:dur,easing:"ease-in-out"}); }
function T(x,y,str,{size=18,fill="var(--ink)",anchor="middle",cls="",weight=400,baseline="middle",ls=0}={}){
  const t=S("text",{x,y,"text-anchor":anchor,"dominant-baseline":baseline,"font-size":size,"font-weight":weight,fill,class:cls,text:str});
  if(ls)t.setAttribute("letter-spacing",ls); return t;
}
function box(cx,cy,w,h,label,{stroke="var(--blue)",fill="var(--panel)",text="var(--ink)",sub,rx=11,size=16}={}){
  const g=S("g");
  g.appendChild(S("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx,fill,stroke,"stroke-width":1.6}));
  g.appendChild(T(cx,sub?cy-8:cy,label,{size,fill:text,cls:"mono"}));
  if(sub) g.appendChild(T(cx,cy+13,sub,{size:11,fill:"var(--muted)",cls:"mono"}));
  g._c={cx,cy,w,h}; return g;
}
function chip(cx,cy,label,{sub,color="var(--blue)",w=300,h=52}={}){
  const g=S("g");
  g.appendChild(S("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:h/2,fill:"#11161d",stroke:color,"stroke-width":1.5}));
  g.appendChild(T(cx,sub?cy-8:cy,label,{size:14,cls:"mono",fill:color,weight:600}));
  if(sub) g.appendChild(T(cx,cy+11,sub,{size:10.5,fill:"var(--muted)",cls:"mono"}));
  g._c={cx,cy,w,h}; return g;
}
function link(p1,p2,{color="var(--line)",width:wd=2,dash=false,arrow=true}={}){
  const p=S("path",{d:`M ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]}`,stroke:color,"stroke-width":wd,fill:"none","stroke-linecap":"round"});
  if(arrow)p.setAttribute("marker-end","url(#ah)");
  if(dash)p.setAttribute("stroke-dasharray","7 7");
  return p;
}
const rightOf=g=>[g._c.cx+g._c.w/2, g._c.cy];
const leftOf =g=>[g._c.cx-g._c.w/2, g._c.cy];
const topOf  =g=>[g._c.cx, g._c.cy-g._c.h/2];
const botOf  =g=>[g._c.cx, g._c.cy+g._c.h/2];
function setCap(html){ capEl.innerHTML=html; capEl.style.opacity = html? 1 : 0; }
function clearStage(){ while(stage.firstChild) stage.removeChild(stage.firstChild); }
function head(g,kicker,title,accent="var(--blue)"){
  const k=T(92,102,kicker,{size:13,cls:"mono",fill:accent,anchor:"start",weight:700,ls:3});
  const h=T(92,150,title,{size:28,cls:"disp",fill:"var(--ink)",anchor:"start",weight:600});
  g.appendChild(k); g.appendChild(h); fadeIn(k,{dy:8,dur:400}); fadeIn(h,{dy:12,dur:600,delay:80});
  return h;
}
function card(g,cx,cy,w,h,{n,title,body,accent="var(--blue)"}){
  const grp=S("g");
  grp.appendChild(S("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:14,fill:"#10141b",stroke:accent,"stroke-width":1.5}));
  const lx=cx-w/2+20; let ly=cy-h/2+38;
  if(n){ grp.appendChild(T(lx,ly,n,{size:30,cls:"disp",fill:accent,anchor:"start"})); ly+=30; }
  grp.appendChild(T(lx,ly,title,{size:15,cls:"mono",fill:"var(--ink)",anchor:"start"})); ly+=24;
  (body||[]).forEach(b=>{ grp.appendChild(T(lx,ly,b,{size:12,fill:"var(--muted)",anchor:"start"})); ly+=19; });
  g.appendChild(grp); return grp;
}

/* ===================================================================== */
const scenes=[];
const SC=(title,hold,play)=>scenes.push({title,hold,play});

// 0 -- Title -------------------------------------------------------------
SC("Title",2800,async({g,cap,live})=>{
  const dot=S("circle",{cx:640,cy:248,r:9,fill:"var(--gold)",filter:"url(#glow)"}); g.appendChild(dot);
  dot.animate([{opacity:.4},{opacity:1},{opacity:.4}],{duration:2600,iterations:Infinity,easing:"ease-in-out"});
  pop(dot,{dur:700});
  const w=T(640,350,"The Action Control Plane",{size:50,cls:"disp",fill:"var(--ink)",weight:600}); g.appendChild(w);
  const w2=T(640,402,"for Enterprise Agents",{size:50,cls:"disp",fill:"var(--gold)",weight:600}); g.appendChild(w2);
  await fadeIn(w,{dur:900,delay:300,dy:18}); if(!live())return;
  await fadeIn(w2,{dur:700,dy:14}); if(!live())return;
  const s=T(640,460,"Bounded autonomy.  Verifiable accountability.  Real-time control -- across every agent platform you run.",{size:15,fill:"var(--muted)",cls:"mono"}); g.appendChild(s);
  fadeIn(s,{dy:6});
  cap(`The reference architecture, for the people who have to approve it: <b>CTO, CIO, Enterprise Architecture.</b>`);
});

// 1 -- The shift ---------------------------------------------------------
SC("The shift",3000,async({g,cap,live})=>{
  head(g,"THE SHIFT","Agents are moving from copilots to actors.","var(--amber)");
  const co=box(360,360,260,100,"copilot",{stroke:"var(--blue)",sub:"suggests - you act"});
  g.appendChild(co); await pop(co); if(!live())return;
  const arrow=link(rightOf(co),[760,360],{color:"var(--amber)",width:2.6}); g.appendChild(arrow); await drawOn(arrow,{dur:600}); if(!live())return;
  const ac=box(940,360,260,100,"actor",{stroke:"var(--red)",sub:"takes the action itself"});
  g.appendChild(ac); await pop(ac); if(!live())return;
  cap(`An agent that only drafts text is low-risk. An agent that <b>moves money, changes infra, emails customers</b> is a different proposition.`);
  await wait(1500); if(!live())return;
  const t=box(640,520,520,56,"the binding constraint is no longer capability -- it's TRUST",{stroke:"var(--gold)",fill:"#1d1808",size:16}); g.appendChild(t);
  await pop(t,{dur:500});
  cap(`The moment an agent can act, the question that gates production isn't "can it?" -- it's <span class="g">"can we trust and prove what it did?"</span>`);
});

// 2 -- Your fleet today --------------------------------------------------
SC("Your fleet today",3200,async({g,cap,live})=>{
  head(g,"THE REALITY","You don't run one agent platform. You run all of them.","var(--blue)");
  const cards=[
    {x:330,title:"Platform-Native",accent:"var(--blue)",body:["Amazon Bedrock AgentCore","Google Vertex Agents","Databricks Mosaic AI","Azure AI Foundry"]},
    {x:640,title:"Multi-Platform (A2A)",accent:"var(--teal)",body:["Agent-to-Agent protocol","Cross-cloud / partner","agents that call agents"]},
    {x:950,title:"Hybrid",accent:"var(--purple)",body:["LangGraph","CrewAI / AutoGen","Private RAG / knowledge","SaaS tools & systems"]},
  ];
  for(const c of cards){ const k=card(g,c.x,360,280,210,{title:c.title,body:c.body,accent:c.accent}); pop(k,{dur:460}); await wait(320); if(!live())return; }
  cap(`Native, multi-platform, and hybrid -- each with its own identity, its own controls. Governing them one-by-one doesn't scale.`);
});

// 3 -- Two boundaries ----------------------------------------------------
SC("Two boundaries",3200,async({g,cap,live})=>{
  head(g,"THE INSIGHT","Every agent action crosses two boundaries.","var(--gold)");
  const agent=box(640,360,180,84,"agent",{stroke:"var(--blue)"}); g.appendChild(agent); await pop(agent); if(!live())return;
  const tools=box(1050,360,190,76,"tools & data",{stroke:"var(--teal)",sub:"MCP"});
  const peer=box(230,360,190,76,"another agent",{stroke:"var(--purple)",sub:"A2A / handoff"});
  g.appendChild(tools); g.appendChild(peer);
  const l1=link(rightOf(agent),leftOf(tools),{color:"var(--teal)",width:2.4});
  const l2=link(leftOf(agent),rightOf(peer),{color:"var(--purple)",width:2.4});
  g.appendChild(l1); g.appendChild(l2);
  await Promise.all([pop(tools),pop(peer),drawOn(l1,{dur:450}),drawOn(l2,{dur:450})]); if(!live())return;
  g.appendChild(T(845,335,"1)  Agent -> Tools & Data (MCP)",{size:13,cls:"mono",fill:"var(--teal)"}));
  g.appendChild(T(435,335,"2)  Agent -> Agent (A2A)",{size:13,cls:"mono",fill:"var(--purple)"}));
  await wait(400); if(!live())return;
  const warden=box(640,510,360,60,"WARDEN governs both -- drop-in proxy, no code change",{stroke:"var(--gold)",fill:"#1d1808",size:14}); g.appendChild(warden);
  const u1=link(topOf(warden),[640,402],{color:"var(--gold)",dash:true,arrow:false}); g.appendChild(u1); drawOn(u1,{dur:300});
  await pop(warden,{dur:500});
  cap(`The tool boundary and the agent-to-agent boundary. Warden sits on <b>both</b> -- and you point the MCP client at it. No agent rewrite.`);
});

// 4 -- The control plane (3-tier) ---------------------------------------
SC("One control plane",3600,async({g,cap,live})=>{
  head(g,"THE ARCHITECTURE","One vendor-neutral control plane in the middle.","var(--gold)");
  // platforms tier
  const plats=[["Platform-Native",360],["Multi-Platform A2A",640],["Hybrid",920]];
  for(const [l,x] of plats){ const b=box(x,210,250,46,l,{stroke:"var(--blue)",size:13}); g.appendChild(b); pop(b,{dur:320}); }
  await wait(400); if(!live())return;
  // warden band
  const W=box(640,360,820,104,"WARDEN  -  Action Control Plane",{stroke:"var(--gold)",size:20,sub:"verify identity  ->  apply policy  ->  record outcome   (same on every platform)"});
  W.querySelector("rect").setAttribute("fill","#0f1219");
  g.appendChild(W); await pop(W,{dur:600}); if(!live())return;
  g.appendChild(T(640,322,"vendor-neutral  -  open audit standard  -  the brake & black-box recorder",{size:12.5,cls:"mono",fill:"var(--amber)"}));
  for(const [l,x] of plats){ const p=link([x,233],[x,308],{color:"#2f3645"}); g.appendChild(p); drawOn(p,{dur:280}); }
  await wait(300); if(!live())return;
  // systems tier
  const sys=[["Databases",250],["DevOps",450],["Ticketing/ITSM",640],["Knowledge/RAG",840],["SaaS APIs",1040]];
  for(const [l,x] of sys){ const b=box(x,540,180,46,l,{stroke:"var(--teal)",size:12}); g.appendChild(b); pop(b,{dur:300});
    const p=link([x,412],[x,517],{color:"#2f3645"}); g.appendChild(p); drawOn(p,{dur:280}); await wait(120); if(!live())return; }
  g.appendChild(T(1130,490,"via MCP",{size:12,cls:"mono",fill:"var(--teal)"}));
  cap(`Your platforms on top, your systems of record below, and one control plane between them -- enforcing the <b>same way on every platform.</b>`);
});

// 5 -- Four pillars ------------------------------------------------------
SC("What it does on every action",3400,async({g,cap,live})=>{
  head(g,"INSIDE WARDEN","Four jobs, on every single action.","var(--purple)");
  const cards=[
    {x:330,title:"Identity & Accountability",accent:"var(--gold)",body:["Every action tied to a","named human via a signed","delegation chain."]},
    {x:640,title:"Authorization",accent:"var(--blue)",body:["RBAC - ABAC - ReBAC.","Least privilege, scoped","per action & per resource."]},
    {x:950,title:"Oversight & Control",accent:"var(--amber)",body:["Human pre-approval holds,","spend budgets, instant","revocation & pause."]},
  ];
  for(const c of cards){ const k=card(g,c.x,300,280,150,{title:c.title,body:c.body,accent:c.accent}); pop(k,{dur:420}); await wait(280); if(!live())return; }
  const ev=card(g,640,470,640,120,{title:"Evidence -- the black-box recorder",accent:"var(--green)",body:["Tamper-evident, regulator-grade audit. Every decision appended to a hash-chained record","that proves who was accountable -- and that the record itself was never altered."]});
  await pop(ev,{dur:500});
  cap(`Identity, authorization, oversight, evidence -- the four things a regulator and a CISO both ask for, applied uniformly.`);
});

// 6 -- The decision ------------------------------------------------------
SC("The decision",3200,async({g,cap,live})=>{
  head(g,"PER ACTION","Allow, block, or hold -- always recorded.","var(--green)");
  const W=box(640,250,200,80,"WARDEN",{stroke:"var(--gold)",size:17}); g.appendChild(W); await pop(W); if(!live())return;
  const outs=[
    ["ALLOW","forward to the tool","var(--green)",330],
    ["BLOCK","stop before the tool","var(--red)",640],
    ["HOLD","route to a human","var(--amber)",950],
  ];
  for(const [l,s,c,x] of outs){ const b=box(x,400,250,72,l,{stroke:c,size:20,sub:s}); g.appendChild(b);
    const p=link(botOf(W),[x,364],{color:c,width:1.8}); g.appendChild(p); drawOn(p,{dur:350}); pop(b,{dur:380}); await wait(260); if(!live())return; }
  const audit=box(640,540,720,54,"...all three appended to the tamper-evident audit trail",{stroke:"var(--gold)",fill:"#1d1808",size:15}); g.appendChild(audit);
  for(const [,,,x] of outs){ const p=link([x,436],[640+(x-640)*0.3,513],{color:"#3a4150"}); g.appendChild(p); drawOn(p,{dur:300}); }
  await pop(audit,{dur:500});
  cap(`Three outcomes -- but there is no fourth. Allow, block, or hold; <b>every one is recorded</b> before the action is allowed to happen.`);
});

// 7 -- Standards-native --------------------------------------------------
SC("Drops into your stack",3200,async({g,cap,live})=>{
  head(g,"STANDARDS-NATIVE","It speaks the standards you already run.","var(--teal)");
  const W=box(640,330,220,90,"WARDEN",{stroke:"var(--gold)",size:18}); g.appendChild(W); await pop(W); if(!live())return;
  const idin=box(250,330,260,70,"your IdP",{stroke:"var(--blue)",sub:"identity carried, not re-platformed"}); g.appendChild(idin);
  const li=link(rightOf(idin),leftOf(W),{color:"var(--blue)",width:2}); g.appendChild(li);
  await Promise.all([pop(idin),drawOn(li,{dur:400})]); if(!live())return;
  const outs=[["OCSF",250],["CAEP",430],["OpenTelemetry",610],["AuthZEN",790]];
  let i=0;
  for(const [l,y] of outs){ const ch=chip(1010,210+i*70,l,{color:"var(--teal)",w:220,h:48}); g.appendChild(ch);
    const p=link(rightOf(W),leftOf(ch),{color:"var(--teal)",width:1.5}); g.appendChild(p); drawOn(p,{dur:300}); pop(ch); i++; await wait(220); if(!live())return; }
  cap(`Your existing identity mints the token; Warden verifies it. Evidence leaves as <span class="t">OCSF, CAEP, OpenTelemetry, AuthZEN</span> -- into the SIEM and tools you already own.`);
});

// 8 -- Why it matters ----------------------------------------------------
SC("Why it matters",3600,async({g,cap,live})=>{
  head(g,"THE PAYOFF","Six outcomes an executive can underwrite.","var(--gold)");
  const items=[
    ["Ship agents faster","Security can finally say yes.","var(--green)"],
    ["Bounded autonomy","Never exceeds the human's authority.","var(--blue)"],
    ["Regulator-grade evidence","Prove who acted -- untampered.","var(--gold)"],
    ["No vendor lock-in","One plane, one audit standard.","var(--teal)"],
    ["Real-time kill switch","Revoke token, agent, or person.","var(--red)"],
    ["Regulatory alignment","MAS guidance - EU AI Act.","var(--purple)"],
  ];
  const pos=[[330,260],[640,260],[950,260],[330,430],[640,430],[950,430]];
  for(let i=0;i<items.length;i++){ const [t,s,c]=items[i],[x,y]=pos[i];
    const k=card(g,x,y,290,120,{title:t,body:[s],accent:c}); pop(k,{dur:360}); await wait(220); if(!live())return; }
  cap(`Faster to production, bounded, provable, portable, instantly revocable, and aligned to the regulation that's already arriving.`);
});

// 9 -- Adopt in stages ---------------------------------------------------

    {x:330,t:"OBSERVE",s:"audit-only, drop-in",b:"zero behavior change",c:"var(--blue)"},

    {x:950,t:"GOVERN",s:"revocation + retention",b:"compliance reporting",c:"var(--gold)"},

  let prev=null;
  for(const st of stages){ const k=card(g,st.x,340,250,160,{title:st.t,body:[st.s,st.b],accent:st.c}); pop(k,{dur:440});

});

/* ===================================================================== */
const RUN={token:0, playing:true, i:0, finished:false};
const bar=document.getElementById("bar");
const dotsEl=document.getElementById("dots");
const slabel=document.getElementById("slabel");
const playBtn=document.getElementById("play");
scenes.forEach((s,i)=>{ const d=document.createElement("button"); d.className="dot"; d.title=s.title; d.onclick=()=>go(i); dotsEl.appendChild(d); s._dot=d; });
function chrome(i){
  bar.style.width=((i)/(scenes.length-1)*100)+"%";
  chipEl.innerHTML=`<b>${String(i+1).padStart(2,"0")}</b> / ${scenes.length} &middot; ${scenes[i].title}`;
  slabel.innerHTML=`<b>${scenes[i].title}</b>`;
  scenes.forEach((s,j)=>s._dot.classList.toggle("on",j===i));
}
function setPlayIcon(){ playBtn.innerHTML = RUN.playing ? "&#10073;&#10073;" : "&#9654;"; }
async function go(i){
  i=Math.max(0,Math.min(scenes.length-1,i));
  const t=++RUN.token; RUN.i=i; RUN.finished=false;
  clearStage(); setCap(""); chrome(i);
  const live=()=>t===RUN.token; const cap=html=>{ if(live()) setCap(html); };
  try{ await scenes[i].play({g:stage,cap,live}); }catch(e){ console.warn(e); }
  if(!live()) return;
  RUN.finished=true;
  if(RUN.playing){ await wait(scenes[i].hold||1600); if(live() && RUN.playing){ if(i<scenes.length-1) go(i+1); else { RUN.playing=false; setPlayIcon(); } } }
}
function setPlaying(p){ RUN.playing=p; setPlayIcon(); if(p && RUN.finished){ if(RUN.i<scenes.length-1) go(RUN.i+1); else go(RUN.i); } }
document.getElementById("next").onclick=()=>go(RUN.i+1);
document.getElementById("prev").onclick=()=>go(RUN.i-1);
document.getElementById("replay").onclick=()=>go(RUN.i);
playBtn.onclick=()=>setPlaying(!RUN.playing);
document.getElementById("stage").onclick=()=>go(RUN.i+1);
document.addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault(); setPlaying(!RUN.playing);}
  else if(e.key==="ArrowRight") go(RUN.i+1);
  else if(e.key==="ArrowLeft") go(RUN.i-1);
  else if(e.key==="r"||e.key==="R") go(RUN.i);
  else if(e.key==="Home") go(0);
});
setPlayIcon(); go(0);
</script>
