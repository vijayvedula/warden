<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Warden - Threat Model - an animated explainer</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#14181f; --ink:#e9ecf2; --muted:#878ea0;
    --blue:#5ec8e8; --gold:#ffd166; --green:#6ee7a8; --red:#ff6f6f;
    --amber:#f5a623; --purple:#b79cf6; --teal:#52d6c0; --line:#39414f;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --display:"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; min-height:100%; -webkit-font-smoothing:antialiased;}
  .topbar{width:100%; max-width:1180px; display:flex; align-items:baseline; justify-content:space-between; padding:18px 8px 10px; gap:12px;}
  .brand{font-family:var(--display); font-size:19px; letter-spacing:.3px}
  .brand b{color:var(--gold); font-weight:600}
  .tagline{color:var(--muted); font-size:13px; font-family:var(--mono)}
  .progress{width:100%; max-width:1180px; height:3px; background:#1a1f29; border-radius:3px; overflow:hidden}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--red),var(--gold)); transition:width .4s ease}
  .stage{position:relative; width:min(100%, calc((100vh - 210px) * 16 / 9)); max-width:1180px; aspect-ratio:16/9; margin:14px 0 8px;
    border:1px solid #1d232e; border-radius:14px; overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%, #11161f 0%, var(--bg) 60%), radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
    background-size:auto, 26px 26px; box-shadow:0 30px 80px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03); cursor:pointer; user-select:none;}
  svg#viz{position:absolute; inset:0; width:100%; height:100%; display:block}
  #viz text{font-family:var(--sans); fill:var(--ink)}
  #viz text.mono{font-family:var(--mono)}
  #viz text.disp{font-family:var(--display)}
  #scene *{transform-box:fill-box; transform-origin:center}
  .chip{position:absolute; top:14px; left:16px; font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.4px;
    background:rgba(10,12,16,.6); border:1px solid #232a36; border-radius:999px; padding:5px 12px; backdrop-filter:blur(4px);}
  .chip b{color:var(--blue)}
  .cap{position:absolute; left:0; right:0; bottom:0; padding:20px 7% 24px; font-size:clamp(13px,1.6vw,20px); line-height:1.5; text-align:center;
    background:linear-gradient(0deg, rgba(7,9,12,.95) 32%, rgba(7,9,12,0)); min-height:80px; transition:opacity .45s ease; opacity:0;}
  .cap b{color:var(--ink); font-weight:600}
  .cap code{font-family:var(--mono); font-size:.92em; color:var(--blue); background:rgba(94,200,232,.1); padding:1px 6px; border-radius:5px}
  .cap .g{color:var(--gold)} .cap .b{color:var(--blue)} .cap .gr{color:var(--green)}
  .cap .r{color:var(--red)} .cap .p{color:var(--purple)} .cap .am{color:var(--amber)} .cap .t{color:var(--teal)}
  .controls{width:100%; max-width:1180px; display:flex; align-items:center; gap:14px; padding:8px 6px 22px; flex-wrap:wrap;}
  .btn{appearance:none; background:#161b24; color:var(--ink); border:1px solid #283040; width:42px; height:42px; border-radius:11px; font-size:16px; cursor:pointer; display:grid; place-items:center; transition:.15s;}
  .btn:hover{background:#1d2533; border-color:#3a455a}
  .btn.play{width:52px; height:52px; font-size:18px; background:#1b2330; border-color:#33415a}
  .dots{display:flex; gap:7px; flex:1; flex-wrap:wrap; align-items:center; justify-content:center}
  .dot{width:9px; height:9px; border-radius:50%; background:#2a3140; cursor:pointer; transition:.2s; border:none; padding:0}
  .dot:hover{background:#46506a}
  .dot.on{background:var(--gold); transform:scale(1.35); box-shadow:0 0 10px rgba(255,209,102,.5)}
  .scenelabel{font-family:var(--mono); font-size:12.5px; color:var(--muted); min-width:210px; text-align:right}
  .scenelabel b{color:var(--ink)}
  .hint{width:100%; max-width:1180px; text-align:center; color:#5c6475; font-size:12px; font-family:var(--mono); padding-bottom:30px}
  @media (max-width:640px){ .scenelabel{display:none} .tagline{display:none} }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><b>Warden</b> &mdash; Threat Model</div>
    <div class="tagline">an animated explainer</div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="stage" id="stage" title="click to advance">
    <svg id="viz" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ah" markerWidth="11" markerHeight="11" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/>
        </marker>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="scene"></g>
    </svg>
    <div class="chip" id="chip"></div>
    <div class="cap" id="cap"></div>
  </div>
  <div class="controls">
    <button class="btn" id="prev" title="previous (&larr;)">&#9664;</button>
    <button class="btn play" id="play" title="play / pause (space)">&#10073;&#10073;</button>
    <button class="btn" id="next" title="next (&rarr;)">&#9654;</button>
    <button class="btn" id="replay" title="replay scene (r)">&#8635;</button>
    <div class="dots" id="dots"></div>
    <div class="scenelabel" id="slabel"></div>
  </div>
  <div class="hint">space play/pause &nbsp;&middot;&nbsp; &larr; / &rarr; scenes &nbsp;&middot;&nbsp; r replay &nbsp;&middot;&nbsp; click canvas to advance</div>

<script>
const NS="http://www.w3.org/2000/svg";
const stage=document.getElementById("scene");
const capEl=document.getElementById("cap");
const chipEl=document.getElementById("chip");
function S(tag,attrs={},kids=[]){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs){ if(k==="text") n.textContent=attrs[k]; else n.setAttribute(k,attrs[k]); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c&&n.appendChild(c));
  return n;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function anim(node,frames,opts={}){
  const a=node.animate(frames,Object.assign({fill:"both",easing:"cubic-bezier(.42,0,.2,1)"},opts));
  return a.finished.catch(()=>{});
}
function fadeIn(node,{dur=600,delay=0,dy=14,dx=0}={}){
  return anim(node,[{opacity:0,transform:`translate(${dx}px,${dy}px)`},{opacity:1,transform:"translate(0,0)"}],{duration:dur,delay});
}
function pop(node,{dur=460,delay=0}={}){
  return anim(node,[{opacity:0,transform:"scale(.7)"},{opacity:1,transform:"scale(1)"}],{duration:dur,delay,easing:"cubic-bezier(.3,1.5,.5,1)"});
}
function drawOn(path,{dur=850,delay=0,ease="ease-in-out"}={}){
  const L=path.getTotalLength(); path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
  return anim(path,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:dur,delay,easing:ease});
}
function pulse(node,{scale=1.16,dur=900}={}){ return node.animate([{transform:"scale(1)"},{transform:`scale(${scale})`},{transform:"scale(1)"}],{duration:dur,easing:"ease-in-out"}); }
function T(x,y,str,{size=18,fill="var(--ink)",anchor="middle",cls="",weight=400,baseline="middle",ls=0}={}){
  const t=S("text",{x,y,"text-anchor":anchor,"dominant-baseline":baseline,"font-size":size,"font-weight":weight,fill,class:cls,text:str});
  if(ls)t.setAttribute("letter-spacing",ls); return t;
}
function box(cx,cy,w,h,label,{stroke="var(--blue)",fill="var(--panel)",text="var(--ink)",sub,rx=11,size=16}={}){
  const g=S("g");
  g.appendChild(S("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx,fill,stroke,"stroke-width":1.6}));
  g.appendChild(T(cx,sub?cy-8:cy,label,{size,fill:text,cls:"mono"}));
  if(sub) g.appendChild(T(cx,cy+13,sub,{size:11,fill:"var(--muted)",cls:"mono"}));
  g._c={cx,cy,w,h}; return g;
}
function chip(cx,cy,label,{sub,color="var(--blue)",w=300,h=52}={}){
  const g=S("g");
  g.appendChild(S("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:h/2,fill:"#11161d",stroke:color,"stroke-width":1.5}));
  g.appendChild(T(cx,sub?cy-8:cy,label,{size:14,cls:"mono",fill:color,weight:600}));
  if(sub) g.appendChild(T(cx,cy+11,sub,{size:10.5,fill:"var(--muted)",cls:"mono"}));
  g._c={cx,cy,w,h}; return g;
}
function link(p1,p2,{color="var(--line)",width:wd=2,dash=false,arrow=true}={}){
  const p=S("path",{d:`M ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]}`,stroke:color,"stroke-width":wd,fill:"none","stroke-linecap":"round"});
  if(arrow)p.setAttribute("marker-end","url(#ah)");
  if(dash)p.setAttribute("stroke-dasharray","7 7");
  return p;
}
const rightOf=g=>[g._c.cx+g._c.w/2, g._c.cy];
const leftOf =g=>[g._c.cx-g._c.w/2, g._c.cy];
const topOf  =g=>[g._c.cx, g._c.cy-g._c.h/2];
const botOf  =g=>[g._c.cx, g._c.cy+g._c.h/2];
function setCap(html){ capEl.innerHTML=html; capEl.style.opacity = html? 1 : 0; }
function clearStage(){ while(stage.firstChild) stage.removeChild(stage.firstChild); }
function head(g,kicker,title,accent="var(--red)"){
  const k=T(92,102,kicker,{size:13,cls:"mono",fill:accent,anchor:"start",weight:700,ls:3});
  const h=T(92,150,title,{size:28,cls:"disp",fill:"var(--ink)",anchor:"start",weight:600});
  g.appendChild(k); g.appendChild(h); fadeIn(k,{dy:8,dur:400}); fadeIn(h,{dy:12,dur:600,delay:80});
  return h;
}
async function rows(g,items,{x=112,y0=232,step=80,live}){
  for(const it of items){
    const grp=S("g");
    grp.appendChild(S("circle",{cx:x,cy:y0,r:4.5,fill:it.c||"var(--blue)"}));
    grp.appendChild(T(x+22,y0-4,it.h,{size:18,anchor:"start",fill:"var(--ink)",weight:600}));
    if(it.s) grp.appendChild(T(x+22,y0+18,it.s,{size:13.5,anchor:"start",fill:"var(--muted)"}));
    g.appendChild(grp); fadeIn(grp,{dx:-12,dy:0,dur:380});
    y0+=step; await wait(280); if(!live())return;
  }
}
function card(g,cx,cy,w,h,{n,title,body,accent="var(--blue)"}){
  const grp=S("g");
  grp.appendChild(S("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:14,fill:"#10141b",stroke:accent,"stroke-width":1.5}));
  const lx=cx-w/2+20; let ly=cy-h/2+40;
  if(n){ grp.appendChild(T(lx,ly,n,{size:34,cls:"disp",fill:accent,anchor:"start"})); ly+=30; }
  grp.appendChild(T(lx,ly,title,{size:14.5,cls:"mono",fill:"var(--ink)",anchor:"start"})); ly+=24;
  (body||[]).forEach(b=>{ grp.appendChild(T(lx,ly,b,{size:12,fill:"var(--muted)",anchor:"start"})); ly+=19; });
  g.appendChild(grp); return grp;
}

/* ===================================================================== */
const scenes=[];
const SC=(title,hold,play)=>scenes.push({title,hold,play});

// 0 -- Title -------------------------------------------------------------
SC("Title",2800,async({g,cap,live})=>{
  const dot=S("circle",{cx:640,cy:255,r:9,fill:"var(--red)",filter:"url(#glow)"}); g.appendChild(dot);
  dot.animate([{opacity:.4},{opacity:1},{opacity:.4}],{duration:2400,iterations:Infinity,easing:"ease-in-out"});
  pop(dot,{dur:700});
  const t1=T(640,375,"What if the agent is the attacker?",{size:46,cls:"disp",fill:"var(--ink)",weight:600}); g.appendChild(t1);
  await fadeIn(t1,{dur:900,delay:300,dy:18}); if(!live())return;
  const t2=T(640,432,"A STRIDE threat model for Warden",{size:21,fill:"var(--muted)"}); g.appendChild(t2);
  await fadeIn(t2,{dur:700});
  cap(`Most systems trust the client. Warden's threat model begins by assuming the opposite.`);
});

// 1 -- The premise -------------------------------------------------------
SC("The premise",3200,async({g,cap,live})=>{
  head(g,"THE PREMISE","The agent is untrusted -- by design.","var(--red)");
  const agent=box(250,360,200,80,"AI agent",{stroke:"var(--red)",sub:"prompt-injected or buggy"});
  const warden=box(640,360,200,90,"WARDEN",{stroke:"var(--gold)",size:18,sub:"enforcement point"}); warden.querySelector("rect").setAttribute("fill","#0f1219");
  const tools=box(1030,360,200,80,"tool servers",{stroke:"var(--teal)",sub:"money, infra, data"});
  g.appendChild(agent); g.appendChild(warden); g.appendChild(tools);
  await Promise.all([pop(agent),pop(warden,{delay:150}),pop(tools,{delay:300})]); if(!live())return;
  const l1=link(rightOf(agent),leftOf(warden),{color:"var(--red)",width:2.4});
  const l2=link(rightOf(warden),leftOf(tools),{color:"#3a4150"});
  g.appendChild(l1); g.appendChild(l2); await Promise.all([drawOn(l1,{dur:400}),drawOn(l2,{dur:400})]); if(!live())return;
  // flip: trusted client crossed out
  const old=T(250,470,"trusted client",{size:15,cls:"mono",fill:"var(--muted)"}); g.appendChild(old);
  await fadeIn(old,{dy:6}); if(!live())return;
  const strike=S("line",{x1:185,y1:470,x2:315,y2:470,stroke:"var(--red)","stroke-width":3,"stroke-linecap":"round"}); g.appendChild(strike); await drawOn(strike,{dur:300});
  g.appendChild(T(250,500,"PRIMARY ADVERSARY",{size:15,cls:"mono",fill:"var(--red)",weight:700}));
  cap(`The agent it protects is also the <span class="r">primary adversary</span> -- prompt-injected, buggy, trying to exceed its authority. Warden is the only thing standing between it and the tools.`);
});

// 2 -- Crown jewels ------------------------------------------------------
SC("Crown jewels",3200,async({g,cap,live})=>{
  head(g,"ASSETS","Crown jewels -- what an attacker wants.","var(--gold)");
  const items=[
    ["A1","the enforcement decision","bypass it -> product is void","var(--gold)"],
    ["A2","the audit chain","the accountability record","var(--gold)"],
    ["A3","identity binding","'which human is answerable'","var(--gold)"],
    ["A4","signing keys","forge evidence / approvals","var(--blue)"],
    ["A5","tool / data access","DB, DevOps, money","var(--blue)"],
    ["A6","policy","defines what's permitted","var(--blue)"],
  ];
  const pos=[[300,260],[640,260],[980,260],[300,430],[640,430],[980,430]];
  for(let i=0;i<items.length;i++){ const [n,t,s,c]=items[i],[x,y]=pos[i];
    const k=card(g,x,y,290,120,{n,title:t,body:[s],accent:c}); pop(k,{dur:380}); await wait(220); if(!live())return; }
  cap(`Six assets. The three in <span class="g">gold</span> -- the decision, the audit chain, the identity binding -- are where an assessor should spend their time.`);
});

// 3 -- Threat actors -----------------------------------------------------
SC("Threat actors",3200,async({g,cap,live})=>{
  head(g,"THREAT ACTORS","Six adversaries, one untrusted core.","var(--red)");
  const warden=box(640,380,170,80,"WARDEN",{stroke:"var(--gold)",size:16}); g.appendChild(warden);
  await pop(warden); if(!live())return;
  const tas=[
    ["TA1 agent","PRIMARY",300,250,"var(--red)"],
    ["TA2 network","MITM",640,210,"var(--amber)"],
    ["TA3 insider","host / files",980,250,"var(--amber)"],
    ["TA4 upstream","rogue tool",1010,380,"var(--amber)"],
    ["TA5 peer A2A","forged txn",980,510,"var(--amber)"],
    ["TA6 sink","bad endpoint",300,420,"var(--amber)"],
  ];
  for(const [l,s,x,y,c] of tas){
    const b=box(x,y,180,58,l,{stroke:c,size:13,sub:s}); g.appendChild(b);
    const p=link([x,y],[640,380],{color:c,width:1.6,dash:true}); g.insertBefore(p,b);
    drawOn(p,{dur:350}); pop(b,{dur:340}); await wait(240); if(!live())return;
  }
  pulse(warden,{scale:1.1});
  cap(`<span class="r">TA1</span>, the compromised agent, is the adversary the whole design is built around. The other five surround the same enforcement point.`);
});

// 4 -- Trust boundaries --------------------------------------------------
SC("Trust boundaries",3200,async({g,cap,live})=>{
  head(g,"TRUST BOUNDARIES","Seven boundaries to defend.","var(--blue)");
  // host ring (boundary 7)
  const ring=S("rect",{x:160,y:200,width:960,height:380,rx:18,fill:"none",stroke:"#39414f","stroke-width":1.5,"stroke-dasharray":"9 7"}); g.appendChild(ring);
  g.appendChild(T(180,218,"7  process / host boundary (at rest: audit, config, keys)",{size:12,cls:"mono",fill:"var(--muted)",anchor:"start"}));
  await fadeIn(ring,{dy:0,dur:500}); if(!live())return;
  const warden=box(640,400,170,80,"WARDEN",{stroke:"var(--gold)",size:16}); g.appendChild(warden); await pop(warden); if(!live())return;
  const nodes=[
    ["1 agent",330,300,"var(--red)"],
    ["2 IdP / JWKS",640,270,"var(--blue)"],
    ["3 tools",950,300,"var(--teal)"],
    ["4 admin / KMS",980,420,"var(--purple)"],
    ["5 sinks",870,520,"var(--amber)"],
    ["6 peer Warden",360,510,"var(--teal)"],
  ];
  for(const [l,x,y,c] of nodes){
    const b=box(x,y,170,50,l,{stroke:c,size:13}); g.appendChild(b);
    const p=link([x,y],[640,400],{color:c,width:1.6}); g.insertBefore(p,b);
    drawOn(p,{dur:320}); pop(b,{dur:300}); await wait(220); if(!live())return;
  }
  cap(`Every arrow is a boundary with its own attacker. The agent edge is untrusted; the rest are TLS, signed feeds, KMS-held keys, and the host at rest.`);
});

// 5 -- STRIDE ------------------------------------------------------------
SC("STRIDE",3000,async({g,cap,live})=>{
  head(g,"METHOD","STRIDE -- six ways things break.","var(--purple)");
  const letters=[
    ["S","Spoofing","identity","var(--red)"],
    ["T","Tampering","integrity","var(--amber)"],
    ["R","Repudiation","deniability","var(--gold)"],
    ["I","Info disclosure","secrets","var(--blue)"],
    ["D","Denial of svc","availability","var(--teal)"],
    ["E","Elevation","the core","var(--purple)"],
  ];
  let x=205;
  for(const [L,name,sub,c] of letters){
    const grp=S("g");
    grp.appendChild(S("rect",{x:x-78,y:280,width:156,height:170,rx:14,fill:"#10141b",stroke:c,"stroke-width":1.5}));
    grp.appendChild(T(x,340,L,{size:54,cls:"disp",fill:c}));
    grp.appendChild(T(x,392,name,{size:14,cls:"mono",fill:"var(--ink)"}));
    grp.appendChild(T(x,416,sub,{size:11.5,fill:"var(--muted)"}));
    g.appendChild(grp); pop(grp,{dur:360}); x+=172; await wait(220); if(!live())return;
  }
  cap(`We walked all six over every boundary. The next slides dramatize the ones that matter most -- and the central claim that ties them together.`);
});

// 6 -- Spoofing ----------------------------------------------------------
SC("Spoofing defeated",3400,async({g,cap,live})=>{
  head(g,"S -- SPOOFING","Three ways to fake identity. Three rejections.","var(--red)");
  const verify=box(870,360,200,90,"verify",{stroke:"var(--gold)",size:16,sub:"identity gate"}); g.appendChild(verify); await pop(verify); if(!live())return;
  const attacks=[
    ["forged token (alg confusion)","asymmetric-only; HMAC excluded","var(--red)",240],
    ["stolen bearer token","DPoP cnf.jkt + per-request proof","var(--amber)",370],
    ["replayed DPoP proof","per-jti replay cache","var(--purple)",500],
  ];
  for(const [l,m,c,y] of attacks){
    const a=chip(300,y,l,{sub:m,color:c,w:360,h:56}); g.appendChild(a);
    const p=link(rightOf(a),leftOf(verify),{color:c,width:1.6}); g.appendChild(p);
    pop(a); drawOn(p,{dur:420}); await wait(260); if(!live())return;
    const x=T(loc(verify)[0]+115,y,"reject",{size:14,cls:"mono",fill:"var(--red)",anchor:"start"}); g.appendChild(x); pop(x,{dur:240});
    await wait(180); if(!live())return;
  }
  function loc(b){ return [b._c.cx, b._c.cy]; }
  cap(`A forged signature, a stolen token, a replayed proof -- each hits the same wall. <span class="r">Reject</span>, and the wire identity must equal the token's leaf actor.`);
});

// 7 -- Tampering ---------------------------------------------------------
SC("Tampering defeated",3400,async({g,cap,live})=>{
  head(g,"T -- TAMPERING","Rewrite history? The chain tells on you.","var(--amber)");
  const blocks=[];
  const bx=200, by=330, bw=210, bh=90, gp=60;
  for(let i=0;i<3;i++){ const x=bx+i*(bw+gp);
    const b=box(x+bw/2,by,bw,bh,"#"+(1041+i),{stroke:"var(--green)",size:14,sub:"accountable: alice"}); g.appendChild(b); blocks.push(b);
    await pop(b,{dur:320}); if(i>0){const cl=link(rightOf(blocks[i-1]),leftOf(b),{color:"var(--green)",width:2}); g.appendChild(cl); drawOn(cl,{dur:240}); b._in=cl;} if(!live())return;
  }
  const anchor=box(1010,330,150,90,"ES256 anchor",{stroke:"var(--gold)",fill:"#1d1808",size:13,sub:"signed checkpoint"}); g.appendChild(anchor);
  const al=link(rightOf(blocks[2]),leftOf(anchor),{color:"var(--gold)"}); g.appendChild(al);
  await Promise.all([pop(anchor),drawOn(al,{dur:300})]); if(!live())return;
  cap(`Each row is SHA-256 hash-chained, with the accountable human folded into the hash, and checkpointed by a signed anchor.`);
  await wait(1300); if(!live())return;
  const t=blocks[1].querySelectorAll("text")[1]; t.textContent="accountable: mallory"; t.setAttribute("fill","var(--red)");
  blocks[1].querySelector("rect").animate([{},{stroke:"#ff6f6f"},{stroke:"#ff6f6f"}],{duration:500,fill:"forwards"});
  blocks[2]._in.setAttribute("stroke","var(--red)"); blocks[2]._in.animate([{opacity:1},{opacity:.2},{opacity:1}],{duration:500,iterations:3});
  pop(t,{dur:360});
  cap(`Rewrite one row and the chain breaks; <b>truncate or roll back</b> the whole log and the signed anchor catches it on <code>audit verify</code>. <span class="gr">No silent edit.</span>`);
});

// 8 -- Elevation (the core) ---------------------------------------------
SC("Elevation defeated",3600,async({g,cap,live})=>{
  head(g,"E -- ELEVATION OF PRIVILEGE","The core: no path around the brake.","var(--purple)");
  const agent=box(230,360,170,76,"agent",{stroke:"var(--red)"});
  const disp=box(640,360,210,110,"dispatch",{stroke:"var(--gold)",size:17,sub:"verify-policy-record"}); disp.querySelector("rect").setAttribute("fill","#0f1219");
  const tool=box(1040,360,170,76,"tool",{stroke:"var(--teal)"});
  g.appendChild(agent); g.appendChild(disp); g.appendChild(tool);
  await Promise.all([pop(agent),pop(disp,{delay:150}),pop(tool,{delay:300})]); if(!live())return;
  // attempt to bypass (arc over) -> blocked
  const bypass=S("path",{d:"M 300 330 C 540 170, 840 170, 1000 330",stroke:"var(--red)","stroke-width":2.2,fill:"none","stroke-dasharray":"7 7","marker-end":"url(#ah)"}); g.appendChild(bypass);
  await drawOn(bypass,{dur:700}); if(!live())return;
  const bar=S("line",{x1:640,y1:185,x2:640,y2:245,stroke:"var(--red)","stroke-width":5,"stroke-linecap":"round"}); g.appendChild(bar); pop(bar);
  g.appendChild(T(640,160,"no bypass: all tools/call route through dispatch",{size:13,cls:"mono",fill:"var(--red)"}));
  // legit path
  const l1=link(rightOf(agent),leftOf(disp),{color:"#3a4150"}); const l2=link(rightOf(disp),leftOf(tool),{color:"var(--green)"});
  g.appendChild(l1); g.appendChild(l2); await Promise.all([drawOn(l1,{dur:300}),drawOn(l2,{dur:300})]); if(!live())return;
  await rows(g,[
    {h:"Exceed delegated authority?",s:"effective = scope & role & rel & attrs -- narrowing only.",c:"var(--purple)"},
    {h:"Keep acting after revocation or expiry?",s:"Checked inline (step 0b) + per-action freshness -> deny.",c:"var(--amber)"},
  ],{live,x:112,y0:500,step:64}); if(!live())return;
  cap(`There is no route to a tool that skips the decision. And inside it, authority only ever <b>narrows</b> -- you cannot climb above the human you represent.`);
});

// 9 -- Fail-closed (HERO) -----------------------------------------------
SC("The fail-closed claim",4000,async({g,cap,live})=>{
  head(g,"THE CENTRAL CLAIM","No single failure produces an over-permissive decision.","var(--gold)");
  const deps=[
    "no accountable identity","expired / unrefreshable token","bad / forged signature",
    "IdP / JWKS unreachable","revocation feed stale","control plane down",
    "bad policy reload","high-assurance sink down","upstream crash / hang",
  ];
  const verdict=box(960,375,230,120,"DENY",{stroke:"var(--red)",fill:"#221316",size:30,sub:"and RECORD"});
  const x0=160; let y=215;
  for(let i=0;i<deps.length;i++){
    const c=chip(x0+150,y,deps[i],{color:"var(--red)",w:300,h:38}); g.appendChild(c);
    const p=link([x0+300,y],[leftOf(verdict)[0],375],{color:"#5a2730",width:1.3}); g.insertBefore(p,c);
    drawOn(p,{dur:300}); fadeIn(c,{dx:-10,dy:0,dur:300});
    y+=46; await wait(150); if(!live())return;
  }
  g.appendChild(verdict); await pop(verdict,{dur:600}); if(!live())return;
  pulse(verdict,{scale:1.08});
  cap(`Walk every dependency. Each failure routes to the same place. The worst case is always <span class="r">"deny and record"</span> -- never "allow silently." <b>That is the product.</b>`);
});

// 10 -- Assumptions & non-goals -----------------------------------------
SC("Assumptions & non-goals",3400,async({g,cap,live})=>{
  head(g,"HONEST SCOPE","What we trust, and what we don't claim.","var(--blue)");
  const A=box(370,370,420,300,"",{stroke:"var(--green)"}); const B=box(900,370,420,300,"",{stroke:"var(--amber)"});
  g.appendChild(A); g.appendChild(B);

  const trust=["the host + Warden's binary","the issuer mints tokens correctly","TLS terminated at the edge","clocks loosely synced (leeway)"];

});

// 11 -- Residuals & supply chain ----------------------------------------

  head(g,"RIGOR","Tracked residuals. No silent acceptances.","var(--teal)");

  let i=0;

// 12 -- Maps to an audit (close) ----------------------------------------
SC("How it maps to an audit",4000,async({g,cap,live})=>{
  head(g,"FOR THE ASSESSOR","Crown jewels -> boundaries -> STRIDE -> fail-closed.","var(--gold)");
  const flow=[["crown jewels","var(--gold)"],["trust boundaries","var(--blue)"],["STRIDE","var(--purple)"],["fail-closed proof","var(--green)"]];
  let x=260;
  for(let i=0;i<flow.length;i++){ const [l,c]=flow[i]; const b=box(x,300,210,64,l,{stroke:c,size:15}); g.appendChild(b);
    if(i>0){const p=link([x-260+105,300],[x-105,300],{color:"#3a4150"}); g.appendChild(p); drawOn(p,{dur:240});}

/* ===================================================================== */
const RUN={token:0, playing:true, i:0, finished:false};
const bar=document.getElementById("bar");
const dotsEl=document.getElementById("dots");
const slabel=document.getElementById("slabel");
const playBtn=document.getElementById("play");
scenes.forEach((s,i)=>{ const d=document.createElement("button"); d.className="dot"; d.title=s.title; d.onclick=()=>go(i); dotsEl.appendChild(d); s._dot=d; });
function chrome(i){
  bar.style.width=((i)/(scenes.length-1)*100)+"%";
  chipEl.innerHTML=`<b>${String(i+1).padStart(2,"0")}</b> / ${scenes.length} &middot; ${scenes[i].title}`;
  slabel.innerHTML=`<b>${scenes[i].title}</b>`;
  scenes.forEach((s,j)=>s._dot.classList.toggle("on",j===i));
}
function setPlayIcon(){ playBtn.innerHTML = RUN.playing ? "&#10073;&#10073;" : "&#9654;"; }
async function go(i){
  i=Math.max(0,Math.min(scenes.length-1,i));
  const t=++RUN.token; RUN.i=i; RUN.finished=false;
  clearStage(); setCap(""); chrome(i);
  const live=()=>t===RUN.token; const cap=html=>{ if(live()) setCap(html); };
  try{ await scenes[i].play({g:stage,cap,live}); }catch(e){ console.warn(e); }
  if(!live()) return;
  RUN.finished=true;
  if(RUN.playing){ await wait(scenes[i].hold||1600); if(live() && RUN.playing){ if(i<scenes.length-1) go(i+1); else { RUN.playing=false; setPlayIcon(); } } }
}
function setPlaying(p){ RUN.playing=p; setPlayIcon(); if(p && RUN.finished){ if(RUN.i<scenes.length-1) go(RUN.i+1); else go(RUN.i); } }
document.getElementById("next").onclick=()=>go(RUN.i+1);
document.getElementById("prev").onclick=()=>go(RUN.i-1);
document.getElementById("replay").onclick=()=>go(RUN.i);
playBtn.onclick=()=>setPlaying(!RUN.playing);
document.getElementById("stage").onclick=()=>go(RUN.i+1);
document.addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault(); setPlaying(!RUN.playing);}
  else if(e.key==="ArrowRight") go(RUN.i+1);
  else if(e.key==="ArrowLeft") go(RUN.i-1);
  else if(e.key==="r"||e.key==="R") go(RUN.i);
  else if(e.key==="Home") go(0);
});
setPlayIcon(); go(0);
</script>
