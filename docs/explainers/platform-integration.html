<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Warden - Platform Integration - an animated explainer</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#14181f; --ink:#e9ecf2; --muted:#878ea0;
    --blue:#5ec8e8; --gold:#ffd166; --green:#6ee7a8; --red:#ff6f6f;
    --amber:#f5a623; --purple:#b79cf6; --teal:#52d6c0; --line:#39414f;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --display:"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; min-height:100%; -webkit-font-smoothing:antialiased;}
  .topbar{width:100%; max-width:1180px; display:flex; align-items:baseline; justify-content:space-between; padding:18px 8px 10px; gap:12px;}
  .brand{font-family:var(--display); font-size:19px; letter-spacing:.3px}
  .brand b{color:var(--gold); font-weight:600}
  .tagline{color:var(--muted); font-size:13px; font-family:var(--mono)}
  .progress{width:100%; max-width:1180px; height:3px; background:#1a1f29; border-radius:3px; overflow:hidden}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--gold)); transition:width .4s ease}
  .stage{position:relative; width:min(100%, calc((100vh - 210px) * 16 / 9)); max-width:1180px; aspect-ratio:16/9; margin:14px 0 8px;
    border:1px solid #1d232e; border-radius:14px; overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%, #11161f 0%, var(--bg) 60%), radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
    background-size:auto, 26px 26px; box-shadow:0 30px 80px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03); cursor:pointer; user-select:none;}
  svg#viz{position:absolute; inset:0; width:100%; height:100%; display:block}
  #viz text{font-family:var(--sans); fill:var(--ink)}
  #viz text.mono{font-family:var(--mono)}
  #viz text.disp{font-family:var(--display)}
  #scene *{transform-box:fill-box; transform-origin:center}
  .chip{position:absolute; top:14px; left:16px; font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.4px;
    background:rgba(10,12,16,.6); border:1px solid #232a36; border-radius:999px; padding:5px 12px; backdrop-filter:blur(4px);}
  .chip b{color:var(--blue)}
  .cap{position:absolute; left:0; right:0; bottom:0; padding:22px 7% 26px; font-size:clamp(14px,1.7vw,21px); line-height:1.5; text-align:center;
    background:linear-gradient(0deg, rgba(7,9,12,.94) 30%, rgba(7,9,12,0)); min-height:84px; transition:opacity .45s ease; opacity:0;}
  .cap b{color:var(--ink); font-weight:600}
  .cap code{font-family:var(--mono); font-size:.92em; color:var(--blue); background:rgba(94,200,232,.1); padding:1px 6px; border-radius:5px}
  .cap .g{color:var(--gold)} .cap .b{color:var(--blue)} .cap .gr{color:var(--green)}
  .cap .r{color:var(--red)} .cap .p{color:var(--purple)} .cap .am{color:var(--amber)} .cap .t{color:var(--teal)}
  .controls{width:100%; max-width:1180px; display:flex; align-items:center; gap:14px; padding:8px 6px 22px; flex-wrap:wrap;}
  .btn{appearance:none; background:#161b24; color:var(--ink); border:1px solid #283040; width:42px; height:42px; border-radius:11px; font-size:16px; cursor:pointer; display:grid; place-items:center; transition:.15s;}
  .btn:hover{background:#1d2533; border-color:#3a455a}
  .btn.play{width:52px; height:52px; font-size:18px; background:#1b2330; border-color:#33415a}
  .dots{display:flex; gap:7px; flex:1; flex-wrap:wrap; align-items:center; justify-content:center}
  .dot{width:9px; height:9px; border-radius:50%; background:#2a3140; cursor:pointer; transition:.2s; border:none; padding:0}
  .dot:hover{background:#46506a}
  .dot.on{background:var(--gold); transform:scale(1.35); box-shadow:0 0 10px rgba(255,209,102,.5)}
  .scenelabel{font-family:var(--mono); font-size:12.5px; color:var(--muted); min-width:210px; text-align:right}
  .scenelabel b{color:var(--ink)}
  .hint{width:100%; max-width:1180px; text-align:center; color:#5c6475; font-size:12px; font-family:var(--mono); padding-bottom:30px}
  @media (max-width:640px){ .scenelabel{display:none} .tagline{display:none} }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><b>Warden</b> &mdash; Platform Integration</div>
    <div class="tagline">an animated explainer</div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="stage" id="stage" title="click to advance">
    <svg id="viz" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ah" markerWidth="11" markerHeight="11" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/>
        </marker>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="scene"></g>
    </svg>
    <div class="chip" id="chip"></div>
    <div class="cap" id="cap"></div>
  </div>
  <div class="controls">
    <button class="btn" id="prev" title="previous (&larr;)">&#9664;</button>
    <button class="btn play" id="play" title="play / pause (space)">&#10073;&#10073;</button>
    <button class="btn" id="next" title="next (&rarr;)">&#9654;</button>
    <button class="btn" id="replay" title="replay scene (r)">&#8635;</button>
    <div class="dots" id="dots"></div>
    <div class="scenelabel" id="slabel"></div>
  </div>
  <div class="hint">space play/pause &nbsp;&middot;&nbsp; &larr; / &rarr; scenes &nbsp;&middot;&nbsp; r replay &nbsp;&middot;&nbsp; click canvas to advance</div>

<script>
const NS="http://www.w3.org/2000/svg";
const stage=document.getElementById("scene");
const capEl=document.getElementById("cap");
const chipEl=document.getElementById("chip");
function S(tag,attrs={},kids=[]){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs){ if(k==="text") n.textContent=attrs[k]; else n.setAttribute(k,attrs[k]); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c&&n.appendChild(c));
  return n;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function anim(node,frames,opts={}){
  const a=node.animate(frames,Object.assign({fill:"both",easing:"cubic-bezier(.42,0,.2,1)"},opts));
  return a.finished.catch(()=>{});
}
function fadeIn(node,{dur=600,delay=0,dy=14,dx=0}={}){
  return anim(node,[{opacity:0,transform:`translate(${dx}px,${dy}px)`},{opacity:1,transform:"translate(0,0)"}],{duration:dur,delay});
}
function pop(node,{dur=460,delay=0}={}){
  return anim(node,[{opacity:0,transform:"scale(.7)"},{opacity:1,transform:"scale(1)"}],{duration:dur,delay,easing:"cubic-bezier(.3,1.5,.5,1)"});
}
function drawOn(path,{dur=850,delay=0,ease="ease-in-out"}={}){
  const L=path.getTotalLength(); path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
  return anim(path,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:dur,delay,easing:ease});
}
function pulse(node,{scale=1.16,dur=900}={}){ return node.animate([{transform:"scale(1)"},{transform:`scale(${scale})`},{transform:"scale(1)"}],{duration:dur,easing:"ease-in-out"}); }
function T(x,y,str,{size=18,fill="var(--ink)",anchor="middle",cls="",weight=400,baseline="middle",ls=0}={}){
  const t=S("text",{x,y,"text-anchor":anchor,"dominant-baseline":baseline,"font-size":size,"font-weight":weight,fill,class:cls,text:str});
  if(ls)t.setAttribute("letter-spacing",ls); return t;
}
function box(cx,cy,w,h,label,{stroke="var(--blue)",fill="var(--panel)",text="var(--ink)",sub,rx=11,size=16}={}){
  const g=S("g");
  g.appendChild(S("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx,fill,stroke,"stroke-width":1.6}));
  g.appendChild(T(cx,sub?cy-8:cy,label,{size,fill:text,cls:"mono"}));
  if(sub) g.appendChild(T(cx,cy+13,sub,{size:11,fill:"var(--muted)",cls:"mono"}));
  g._c={cx,cy,w,h}; return g;
}
function chip(cx,cy,label,{sub,color="var(--blue)",w=300,h=52}={}){
  const g=S("g");
  g.appendChild(S("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:h/2,fill:"#11161d",stroke:color,"stroke-width":1.5}));
  g.appendChild(T(cx,sub?cy-8:cy,label,{size:14,cls:"mono",fill:color,weight:600}));
  if(sub) g.appendChild(T(cx,cy+11,sub,{size:10.5,fill:"var(--muted)",cls:"mono"}));
  g._c={cx,cy,w,h}; return g;
}
function link(p1,p2,{color="var(--line)",width:wd=2,dash=false,arrow=true}={}){
  const p=S("path",{d:`M ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]}`,stroke:color,"stroke-width":wd,fill:"none","stroke-linecap":"round"});
  if(arrow)p.setAttribute("marker-end","url(#ah)");
  if(dash)p.setAttribute("stroke-dasharray","7 7");
  return p;
}
const rightOf=g=>[g._c.cx+g._c.w/2, g._c.cy];
const leftOf =g=>[g._c.cx-g._c.w/2, g._c.cy];
const topOf  =g=>[g._c.cx, g._c.cy-g._c.h/2];
const botOf  =g=>[g._c.cx, g._c.cy+g._c.h/2];
function setCap(html){ capEl.innerHTML=html; capEl.style.opacity = html? 1 : 0; }
function clearStage(){ while(stage.firstChild) stage.removeChild(stage.firstChild); }
function headline(txt,color="var(--gold)"){ return T(640,68,txt,{size:26,cls:"disp",fill:color,weight:600}); }
// generic "what Warden adds" trio
async function addsTrio(g,cx,topY,live){
  const items=[["human pre-authorization hold","var(--amber)"],["per-run budgets","var(--blue)"],["tamper-evident recorder","var(--green)"]];
  let y=topY;
  for(const [l,c] of items){ const ch=chip(cx,y,l,{color:c,w:300,h:48}); g.appendChild(ch); pop(ch,{dur:300}); y+=66; await wait(220); if(!live())return; }
}

/* ===================================================================== */
const scenes=[];
const SC=(title,hold,play)=>scenes.push({title,hold,play});

// 0 -- Title -------------------------------------------------------------
SC("Title",2600,async({g,cap,live})=>{
  const dot=S("circle",{cx:640,cy:300,r:9,fill:"var(--gold)",filter:"url(#glow)"}); g.appendChild(dot);
  dot.animate([{opacity:.4},{opacity:1},{opacity:.4}],{duration:2600,iterations:Infinity,easing:"ease-in-out"});
  const t1=T(640,420,"One token. Every platform.",{size:52,cls:"disp",fill:"var(--ink)",weight:600}); g.appendChild(t1);
  const t2=T(640,478,"How Warden integrates with any agentic platform",{size:20,fill:"var(--muted)"}); g.appendChild(t2);
  pop(dot,{dur:700});
  await fadeIn(t1,{dur:900,delay:400,dy:18}); if(!live())return;
  await fadeIn(t2,{dur:700});
});

// 1 -- The problem -------------------------------------------------------
SC("The problem",3000,async({g,cap,live})=>{
  const plats=[["Databricks","var(--amber)"],["Google Vertex","var(--blue)"],["AWS AgentCore","var(--teal)"],["LangGraph","var(--purple)"],["OpenAI Agents","var(--green)"],["CrewAI","var(--gold)"]];
  const pos=[[260,180],[640,170],[1020,180],[260,440],[640,450],[1020,440]];
  for(let i=0;i<plats.length;i++){ const [l,c]=plats[i],[x,y]=pos[i]; const b=box(x,y,210,60,l,{stroke:c,sub:"its own identity"}); g.appendChild(b); pop(b,{dur:340,delay:i*90}); }
  await wait(700); if(!live())return;
  cap(`Every agentic platform has its own identity system, its own credentials, its own way of saying who is acting.`);
  await wait(1600); if(!live())return;
  const q=box(640,300,260,70,"one Warden?",{stroke:"var(--gold)",fill:"#0f1219",size:18}); g.appendChild(q);
  await pop(q,{dur:600});
  cap(`So how can a <b>single</b> Warden build sit in front of all of them &mdash; without a custom rewrite per cloud?`);
});

// 2 -- The thesis: token is the interface --------------------------------
SC("The token is the interface",3400,async({g,cap,live})=>{
  g.appendChild(headline("The token is the interface"));
  const agent=box(180,330,180,76,"platform agent",{stroke:"var(--blue)",size:15});
  const warden=box(680,330,210,100,"WARDEN",{stroke:"var(--gold)",size:19}); warden.querySelector("rect").setAttribute("fill","#0f1219");
  const tool=box(1110,330,160,70,"tool server",{stroke:"var(--teal)",size:15});
  g.appendChild(agent); g.appendChild(warden); g.appendChild(tool);
  await Promise.all([pop(agent),pop(warden,{delay:150}),pop(tool,{delay:300})]); if(!live())return;
  // single token line crosses the boundary
  const tok=chip(430,330,"signed token",{sub:"sub - act - roles - attrs - rel - scope",color:"var(--gold)",w:230,h:54}); g.appendChild(tok);
  const l1=link(rightOf(agent),leftOf(tok),{color:"var(--gold)",width:2.2}); const l2=link(rightOf(tok),leftOf(warden),{color:"var(--gold)",width:2.2});
  const l3=link(rightOf(warden),leftOf(tool),{color:"#3a4150"});
  g.appendChild(l1); g.appendChild(l2); g.appendChild(l3);
  await Promise.all([pop(tok),drawOn(l1,{dur:350}),drawOn(l2,{dur:350,delay:150}),drawOn(l3,{dur:350,delay:300})]); if(!live())return;
  cap(`Warden's boundary is exactly <b>one signed token</b> &mdash; the only coupling point between it and any platform.`);
  await wait(1500); if(!live())return;
  const exp=box(180,540,300,72,"JIT relations - role expansion",{stroke:"#4a556b",size:13,sub:"on-behalf-of exchange"}); g.appendChild(exp);
  await pop(exp); if(!live())return;
  const bar=S("line",{x1:330,y1:430,x2:330,y2:480,stroke:"var(--muted)","stroke-width":3,"stroke-dasharray":"4 5","stroke-linecap":"round"}); g.appendChild(bar);
  cap(`Everything expensive &mdash; relationship resolution, role expansion, on-behalf-of exchange &mdash; <span class="b">stays on the platform side,</span> where it already lives.`);
});

// 3 -- Two things to integrate -------------------------------------------
SC("Two things, that's all",3000,async({g,cap,live})=>{
  g.appendChild(headline("To integrate any platform: two things"));
  const c1=box(380,330,360,200,"",{stroke:"var(--blue)"});
  const c2=box(900,330,360,200,"",{stroke:"var(--purple)"});
  g.appendChild(c1); g.appendChild(c2);
  await Promise.all([pop(c1),pop(c2,{delay:200})]); if(!live())return;
  g.appendChild(T(380,270,"1",{size:46,cls:"disp",fill:"var(--blue)"}));
  g.appendChild(T(380,330,"issuer / verifier config",{size:17,cls:"mono",fill:"var(--ink)"}));
  g.appendChild(T(380,366,"trust the platform's JWKS + aud",{size:13,fill:"var(--muted)"}));
  g.appendChild(T(900,270,"2",{size:46,cls:"disp",fill:"var(--purple)"}));
  g.appendChild(T(900,330,"claims-mapping adapter",{size:17,cls:"mono",fill:"var(--ink)"}));
  g.appendChild(T(900,366,"native concepts -> Warden claims",{size:13,fill:"var(--muted)"}));
  await wait(400); if(!live())return;
  cap(`<span class="b">One:</span> trust the platform's token issuer. <span class="p">Two:</span> map its native identity concepts onto Warden's six claims.`);
  await wait(1700); if(!live())return;
  const note=T(640,500,"Warden just verifies + evaluates.  That is the entire contract.",{size:16,cls:"mono",fill:"var(--gold)"});
  g.appendChild(note); await fadeIn(note,{dy:10});
  cap(`That's the whole contract. <b>Warden verifies and evaluates</b> &mdash; which is what keeps one build portable across every cloud.`);
});

// 4 -- The canonical claim mapping ---------------------------------------
SC("Canonical claim mapping",4000,async({g,cap,live})=>{
  g.appendChild(headline("One mapping table, three platforms"));
  const cols=[["Databricks","var(--amber)",460],["Google","var(--blue)",740],["AWS","var(--teal)",1015]];
  cols.forEach(([l,c,x])=>{ const t=T(x,128,l,{size:15,cls:"mono",fill:c,weight:600}); g.appendChild(t); fadeIn(t,{dy:6,dur:300}); });
  g.appendChild(T(175,128,"Warden claim",{size:13,cls:"mono",fill:"var(--muted)",anchor:"start"}));
  const rows=[
    ["sub","UC OBO user","IAM end-user","Cognito / IAM user"],
    ["act","SP -> agent","svc acct -> agent","STS session -> agent"],
    ["roles","UC privileges","IAM roles / Groups","IAM role / Cognito grp"],
    ["attrs","UC tags","IAM conditions","STS session tags"],
    ["rel","UC grants","IAM bindings / Zanzibar","resource IAM / tags"],
    ["scope","UC funcs / MCP","fn decls / MCP","Gateway allow-list"],
  ];
  let y=185;
  for(const [claim,d,gg,a] of rows){
    const row=S("g");
    row.appendChild(S("rect",{x:150,y:y-23,width:60,height:40,rx:8,fill:"#1d1808",stroke:"var(--gold)","stroke-width":1.3}));
    row.appendChild(T(180,y-3,claim,{size:13,cls:"mono",fill:"var(--gold)"}));
    row.appendChild(T(460,y-3,d,{size:12,cls:"mono",fill:"var(--amber)"}));
    row.appendChild(T(740,y-3,gg,{size:12,cls:"mono",fill:"var(--blue)"}));
    row.appendChild(T(1015,y-3,a,{size:12,cls:"mono",fill:"var(--teal)"}));
    g.appendChild(row); fadeIn(row,{dx:0,dy:8,dur:340}); y+=68; await wait(280); if(!live())return;
  }
  cap(`Each platform's native concept maps onto the <b>same six claims.</b> The agent host does the translation; Warden sees one canonical shape.`);
  await wait(1600); if(!live())return;
  const pat=T(640,565,"every platform has: an issuer  +  on-behalf-of  +  attributes  +  MCP",{size:15,cls:"mono",fill:"var(--gold)"});
  g.appendChild(pat); await fadeIn(pat,{dy:10});
  cap(`The recurring pattern: an issuer, an on-behalf-of mechanism, an attribute facility, and &mdash; increasingly &mdash; MCP. Warden consumes all four through the one token.`);
});

// 5 -- Uniform deployment via MCP ----------------------------------------
SC("They all converge on MCP",3000,async({g,cap,live})=>{
  g.appendChild(headline("And they all converge on MCP"));
  const runtime=box(220,330,200,80,"agent runtime",{stroke:"var(--blue)",sub:"Databricks / Vertex / AgentCore"});
  const warden=box(640,330,200,90,"WARDEN",{stroke:"var(--gold)",size:18,sub:"MCP proxy"}); warden.querySelector("rect").setAttribute("fill","#0f1219");
  const tools=box(1060,330,200,80,"tool servers",{stroke:"var(--teal)",sub:"UC funcs / APIs / Lambdas"});
  g.appendChild(runtime); g.appendChild(warden); g.appendChild(tools);
  await Promise.all([pop(runtime),pop(warden,{delay:150}),pop(tools,{delay:300})]); if(!live())return;
  const l1=link(rightOf(runtime),leftOf(warden),{color:"var(--blue)",width:2.2});
  const l2=link(rightOf(warden),leftOf(tools),{color:"var(--teal)",width:2.2});
  g.appendChild(l1); g.appendChild(l2);
  g.appendChild(T(540,310,"MCP",{size:13,cls:"mono",fill:"var(--blue)"}));
  g.appendChild(T(880,310,"MCP",{size:13,cls:"mono",fill:"var(--teal)"}));
  await Promise.all([drawOn(l1,{dur:400}),drawOn(l2,{dur:400,delay:150})]); if(!live())return;
  cap(`All three clouds are converging on <b>MCP as the tool transport</b> &mdash; which is exactly where Warden already sits.`);
  await wait(1500); if(!live())return;
  const idp=box(640,540,260,60,"platform identity mints the token",{stroke:"var(--gold)",size:13}); g.appendChild(idp);
  const up=link(topOf(idp),botOf(warden),{color:"var(--gold)",dash:true}); g.appendChild(up);
  await Promise.all([pop(idp),drawOn(up,{dur:400})]); if(!live())return;
  cap(`So the deployment story is uniform everywhere: Warden is the MCP proxy between the agent runtime and its tools, and the <span class="g">platform's identity system mints the token.</span>`);
});

// 6 -- Databricks --------------------------------------------------------
SC("Databricks",3200,async({g,cap,live})=>{
  g.appendChild(headline("Databricks - Unity Catalog + Mosaic AI","var(--amber)"));
  const chain=box(360,220,420,64,"UC user -> service principal -> agent",{stroke:"var(--amber)",size:14,sub:"on-behalf-of-user: the human is sub"});
  g.appendChild(chain); await pop(chain); if(!live())return;
  cap(`<b>Databricks.</b> The agent runs as a service principal with on-behalf-of-user auth &mdash; the human who triggered it is the accountable <code>sub</code>.`);
  await wait(1400); if(!live())return;
  const uc=box(330,360,300,64,"Unity Catalog",{stroke:"#4a556b",size:14,sub:"governs the DATA layer"}); g.appendChild(uc);
  await pop(uc); if(!live())return;
  g.appendChild(T(330,420,"UC grants -> rel tuples (source, not duplicated)",{size:12.5,cls:"mono",fill:"var(--muted)"}));
  g.appendChild(T(900,200,"Warden adds the ACTION layer",{size:15,cls:"mono",fill:"var(--gold)"}));
  await addsTrio(g,900,260,live); if(!live())return;
  cap(`UC already governs <b>data</b> &mdash; so its grants become the <i>source</i> for <code>rel</code>, never duplicated. Warden adds the <span class="g">action layer</span> UC has no record of: holds, budgets, and a tamper-evident trail for every tool invocation.`);
});

// 7 -- Google ------------------------------------------------------------
SC("Google",3200,async({g,cap,live})=>{
  g.appendChild(headline("Google - Vertex AI / ADK / A2A","var(--blue)"));
  const chain=box(360,210,420,64,"IAM user -> service account -> agent",{stroke:"var(--blue)",size:14,sub:"workload identity; OIDC sub = the human"});
  g.appendChild(chain); await pop(chain); if(!live())return;
  cap(`<b>Google.</b> Identity is Google IAM &mdash; a service account or workload identity, with the accountable human carried in the OIDC <code>sub</code>.`);
  await wait(1300); if(!live())return;
  const cond=chip(330,330,"IAM conditions -> attrs / when",{color:"var(--teal)",w:380,h:50}); g.appendChild(cond);
  await pop(cond); if(!live())return;
  // A2A hop
  const a=box(250,470,130,56,"agent A",{stroke:"var(--blue)",size:13});
  const b=box(560,470,130,56,"agent B",{stroke:"var(--blue)",size:13});
  g.appendChild(a); g.appendChild(b);
  const hop=link(rightOf(a),leftOf(b),{color:"var(--gold)"}); g.appendChild(hop);
  await Promise.all([pop(a),pop(b),drawOn(hop,{dur:400})]); if(!live())return;
  g.appendChild(T(405,512,"A2A: +1 act hop",{size:12,cls:"mono",fill:"var(--gold)"}));
  g.appendChild(T(960,180,"Warden adds",{size:15,cls:"mono",fill:"var(--gold)"}));
  await addsTrio(g,960,240,live); if(!live())return;
  cap(`IAM <b>conditions</b> map cleanly onto Warden's <code>when</code> clauses; an <span class="g">A2A</span> hand-off extends the act-chain by one. Warden adds the pre-authorization hold and the record tying each call back to a named IAM principal.`);
});

// 8 -- AWS AgentCore -----------------------------------------------------
SC("AWS - Bedrock AgentCore",3400,async({g,cap,live})=>{
  g.appendChild(headline("AWS - Bedrock AgentCore (the closest analogue)","var(--teal)"));
  const maps=[
    ["STS AssumeRole session","= the delegation (act)","var(--teal)"],
    ["STS session tags","= native ABAC (attrs)","var(--blue)"],
    ["session policy on AssumeRole","= the narrowing (scope)","var(--purple)"],
  ];
  let y=180;
  for(const [l,s,c] of maps){ const ch=chip(360,y,l,{sub:s,color:c,w:420,h:56}); g.appendChild(ch); pop(ch,{dur:320}); y+=78; await wait(240); if(!live())return; }
  cap(`<b>AWS.</b> The mapping is almost one-to-one: an STS <code>AssumeRole</code> session <i>is</i> the delegation, session tags <i>are</i> ABAC, the session policy <i>is</i> the scope.`);
  await wait(1500); if(!live())return;
  const gw=box(900,200,300,56,"AgentCore Gateway + Identity",{stroke:"#4a556b",size:13,sub:"tool exposure + IAM access"}); g.appendChild(gw);
  await pop(gw); if(!live())return;
  g.appendChild(T(900,280,"Warden = brake + black-box recorder",{size:14,cls:"mono",fill:"var(--gold)"}));
  await addsTrio(g,900,335,live); if(!live())return;
  cap(`AgentCore Gateway exposes tools and IAM does access control. Warden is <b>complementary</b> &mdash; the synchronous brake and the tamper-evident black-box recorder on the action path. <span class="t">Not a Gateway replacement.</span>`);
});

// 9 -- Two kinds of adapter ----------------------------------------------
SC("Adapters compose, not replace",3400,async({g,cap,live})=>{
  g.appendChild(headline("The SDK: two kinds of adapter, composed","var(--purple)"));
  const ident=box(420,300,330,150,"identity adapter",{stroke:"var(--gold)",sub:"Databricks / Google / AWS"});
  g.appendChild(ident); await pop(ident); if(!live())return;
  g.appendChild(T(420,355,"shapes the token from the",{size:12.5,fill:"var(--muted)"}));
  g.appendChild(T(420,375,"platform's native credential",{size:12.5,fill:"var(--muted)"}));
  const orch=box(880,300,330,150,"orchestration adapter",{stroke:"var(--purple)",sub:"LangGraph / OpenAI / CrewAI / ADK"});
  g.appendChild(orch); await pop(orch); if(!live())return;
  g.appendChild(T(880,355,"routes the framework's tool",{size:12.5,fill:"var(--muted)"}));
  g.appendChild(T(880,375,"calls through Warden + attaches token",{size:12,fill:"var(--muted)"}));
  cap(`The integration isn't one adapter times four. It's <b>two kinds</b>: an <span class="g">identity</span> adapter that mints the token, and an <span class="p">orchestration</span> adapter that routes a framework's calls through Warden.`);
  await wait(1700); if(!live())return;
  const plus=T(650,300,"x",{size:40,cls:"disp",fill:"var(--ink)"}); g.appendChild(plus); pop(plus);
  cap(`A LangGraph app has no <code>sub</code> of its own &mdash; so its orchestration shim <b>composes with</b> a cloud identity adapter. The SDK is (shim per framework) x (identity per platform).`);
});

// 10 -- No forged authority ----------------------------------------------
SC("The no-forged-authority rule",3200,async({g,cap,live})=>{
  g.appendChild(headline("An adapter never signs authority","var(--red)"));
  const adapter=box(330,330,210,80,"adapter",{stroke:"var(--red)",sub:"untrusted client code"});
  g.appendChild(adapter); await pop(adapter); if(!live())return;
  cap(`Remember: an adapter runs on the side Warden exists to police. So it is <span class="r">untrusted client code.</span>`);
  await wait(1300); if(!live())return;
  // adapter tries to sign -> blocked
  const key=chip(330,470,"own signing key?",{color:"var(--red)",w:220,h:48}); g.appendChild(key);
  const dn=link(botOf(adapter),topOf(key),{color:"var(--red)"}); g.appendChild(dn);
  await Promise.all([pop(key),drawOn(dn,{dur:300})]); if(!live())return;
  const bar=S("line",{x1:250,y1:470,x2:410,y2:470,stroke:"var(--red)","stroke-width":5,"stroke-linecap":"round"}); g.appendChild(bar); pop(bar);
  const x=T(330,470,"never",{size:18,cls:"mono",fill:"var(--red)"}); g.appendChild(x);
  cap(`If it held its own broad signing key, that key becomes one high-value secret &mdash; and a compromised host could forge any human's authority.`);
  await wait(1600); if(!live())return;
  const issuer=box(760,250,220,70,"platform issuer",{stroke:"var(--gold)",sub:"the only trusted signer"});
  const warden=box(1080,250,150,70,"WARDEN",{stroke:"var(--gold)",size:15});
  g.appendChild(issuer); g.appendChild(warden);
  const ask=link(rightOf(adapter),leftOf(issuer),{color:"var(--gold)",dash:true});
  const ver=link(rightOf(issuer),leftOf(warden),{color:"var(--gold)"});
  g.appendChild(ask); g.appendChild(ver);
  await Promise.all([pop(issuer),pop(warden,{delay:150}),drawOn(ask,{dur:400}),drawOn(ver,{dur:400,delay:200})]); if(!live())return;
  g.appendChild(T(640,228,"shapes claims, asks issuer to sign",{size:11.5,cls:"mono",fill:"var(--muted)"}));
  cap(`So the adapter only <b>orchestrates the platform's native token exchange</b> &mdash; the issuer signs, Warden verifies against its JWKS. Done right, the SDK adds <span class="gr">no new trust surface.</span>`);
});

// 11 -- Agnostic vs per-platform -----------------------------------------
SC("Build once, adapt thinly",3200,async({g,cap,live})=>{
  g.appendChild(headline("Build once vs. thin per-platform adapter"));
  const A=box(380,330,360,250,"",{stroke:"var(--gold)"}); const B=box(900,330,360,250,"",{stroke:"var(--purple)"});
  g.appendChild(A); g.appendChild(B);
  await Promise.all([pop(A),pop(B,{delay:200})]); if(!live())return;
  g.appendChild(T(380,235,"platform-agnostic (build once)",{size:15,cls:"mono",fill:"var(--gold)"}));
  g.appendChild(T(900,235,"per-platform (thin adapter)",{size:15,cls:"mono",fill:"var(--purple)"}));
  const once=["token verification + pipeline","RBAC / ABAC / ReBAC policy","pause / reload revocation","tamper-evident audit chain"];
  const per=["JWKS / issuer config, aud","claims-mapping adapter","token source (OBO / STS / WI)","MCP transport wiring"];
  let y=290;
  for(let i=0;i<once.length;i++){
    const t1=T(380,y,"- "+once[i],{size:13,cls:"mono",fill:"var(--ink)"});
    const t2=T(900,y,"- "+per[i],{size:13,cls:"mono",fill:"var(--ink)"});
    g.appendChild(t1); g.appendChild(t2); fadeIn(t1,{dx:-10,dy:0,dur:300}); fadeIn(t2,{dx:10,dy:0,dur:300,delay:120});
    y+=44; await wait(260); if(!live())return;
  }
  cap(`Everything that carries policy and proof is built <b>once.</b> The only per-platform code is a thin adapter &mdash; <span class="p">pure data mapping, no policy logic.</span>`);
});

// 12 -- Closing ----------------------------------------------------------
SC("The payoff",4000,async({g,cap,live})=>{

  const w=T(640,290,"WARDEN",{size:58,cls:"disp",fill:"var(--ink)",weight:600,ls:9}); g.appendChild(w);

});

/* ===================================================================== */
const RUN={token:0, playing:true, i:0, finished:false};
const bar=document.getElementById("bar");
const dotsEl=document.getElementById("dots");
const slabel=document.getElementById("slabel");
const playBtn=document.getElementById("play");
scenes.forEach((s,i)=>{ const d=document.createElement("button"); d.className="dot"; d.title=s.title; d.onclick=()=>go(i); dotsEl.appendChild(d); s._dot=d; });
function chrome(i){
  bar.style.width=((i)/(scenes.length-1)*100)+"%";
  chipEl.innerHTML=`<b>${String(i+1).padStart(2,"0")}</b> / ${scenes.length} &middot; ${scenes[i].title}`;
  slabel.innerHTML=`<b>${scenes[i].title}</b>`;
  scenes.forEach((s,j)=>s._dot.classList.toggle("on",j===i));
}
function setPlayIcon(){ playBtn.innerHTML = RUN.playing ? "&#10073;&#10073;" : "&#9654;"; }
async function go(i){
  i=Math.max(0,Math.min(scenes.length-1,i));
  const t=++RUN.token; RUN.i=i; RUN.finished=false;
  clearStage(); setCap(""); chrome(i);
  const live=()=>t===RUN.token; const cap=html=>{ if(live()) setCap(html); };
  try{ await scenes[i].play({g:stage,cap,live}); }catch(e){ console.warn(e); }
  if(!live()) return;
  RUN.finished=true;
  if(RUN.playing){ await wait(scenes[i].hold||1600); if(live() && RUN.playing){ if(i<scenes.length-1) go(i+1); else { RUN.playing=false; setPlayIcon(); } } }
}
function setPlaying(p){ RUN.playing=p; setPlayIcon(); if(p && RUN.finished){ if(RUN.i<scenes.length-1) go(RUN.i+1); else go(RUN.i); } }
document.getElementById("next").onclick=()=>go(RUN.i+1);
document.getElementById("prev").onclick=()=>go(RUN.i-1);
document.getElementById("replay").onclick=()=>go(RUN.i);
playBtn.onclick=()=>setPlaying(!RUN.playing);
document.getElementById("stage").onclick=()=>go(RUN.i+1);
document.addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault(); setPlaying(!RUN.playing);}
  else if(e.key==="ArrowRight") go(RUN.i+1);
  else if(e.key==="ArrowLeft") go(RUN.i-1);
  else if(e.key==="r"||e.key==="R") go(RUN.i);
  else if(e.key==="Home") go(0);
});
setPlayIcon(); go(0);
</script>
