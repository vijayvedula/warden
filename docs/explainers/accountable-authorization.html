<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Warden - Accountable Authorization - an animated explainer</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#14181f; --ink:#e9ecf2; --muted:#878ea0;
    --blue:#5ec8e8; --gold:#ffd166; --green:#6ee7a8; --red:#ff6f6f;
    --amber:#f5a623; --purple:#b79cf6; --teal:#52d6c0; --line:#39414f;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --display:"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    width:100%; max-width:1180px; display:flex; align-items:baseline;
    justify-content:space-between; padding:18px 8px 10px; gap:12px;
  }
  .brand{font-family:var(--display); font-size:19px; letter-spacing:.3px}
  .brand b{color:var(--gold); font-weight:600}
  .tagline{color:var(--muted); font-size:13px; font-family:var(--mono)}
  .progress{width:100%; max-width:1180px; height:3px; background:#1a1f29; border-radius:3px; overflow:hidden}
  .progress > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--gold)); transition:width .4s ease}

  .stage{
    position:relative; width:min(100%, calc((100vh - 210px) * 16 / 9));
    max-width:1180px; aspect-ratio:16/9; margin:14px 0 8px;
    border:1px solid #1d232e; border-radius:14px; overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #11161f 0%, var(--bg) 60%),
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
    background-size:auto, 26px 26px;
    box-shadow:0 30px 80px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03);
    cursor:pointer; user-select:none;
  }
  svg#viz{position:absolute; inset:0; width:100%; height:100%; display:block}
  #viz text{font-family:var(--sans); fill:var(--ink)}
  #viz text.mono{font-family:var(--mono)}
  #viz text.disp{font-family:var(--display)}
  #scene *{transform-box:fill-box; transform-origin:center}

  .chip{
    position:absolute; top:14px; left:16px; font-family:var(--mono);
    font-size:12px; color:var(--muted); letter-spacing:.4px;
    background:rgba(10,12,16,.6); border:1px solid #232a36; border-radius:999px;
    padding:5px 12px; backdrop-filter:blur(4px);
  }
  .chip b{color:var(--blue)}
  .cap{
    position:absolute; left:0; right:0; bottom:0; padding:22px 7% 26px;
    font-size:clamp(14px,1.7vw,21px); line-height:1.5; text-align:center;
    background:linear-gradient(0deg, rgba(7,9,12,.94) 30%, rgba(7,9,12,0));
    min-height:84px; transition:opacity .45s ease; opacity:0;
  }
  .cap b{color:var(--ink); font-weight:600}
  .cap code{font-family:var(--mono); font-size:.92em; color:var(--blue); background:rgba(94,200,232,.1); padding:1px 6px; border-radius:5px}
  .cap .g{color:var(--gold)} .cap .b{color:var(--blue)} .cap .gr{color:var(--green)}
  .cap .r{color:var(--red)} .cap .p{color:var(--purple)} .cap .am{color:var(--amber)} .cap .t{color:var(--teal)}

  .controls{
    width:100%; max-width:1180px; display:flex; align-items:center; gap:14px;
    padding:8px 6px 22px; flex-wrap:wrap;
  }
  .btn{
    appearance:none; background:#161b24; color:var(--ink); border:1px solid #283040;
    width:42px; height:42px; border-radius:11px; font-size:16px; cursor:pointer;
    display:grid; place-items:center; transition:.15s;
  }
  .btn:hover{background:#1d2533; border-color:#3a455a}
  .btn.play{width:52px; height:52px; font-size:18px; background:#1b2330; border-color:#33415a}
  .dots{display:flex; gap:7px; flex:1; flex-wrap:wrap; align-items:center; justify-content:center}
  .dot{width:9px; height:9px; border-radius:50%; background:#2a3140; cursor:pointer; transition:.2s; border:none; padding:0}
  .dot:hover{background:#46506a}
  .dot.on{background:var(--gold); transform:scale(1.35); box-shadow:0 0 10px rgba(255,209,102,.5)}
  .scenelabel{font-family:var(--mono); font-size:12.5px; color:var(--muted); min-width:172px; text-align:right}
  .scenelabel b{color:var(--ink)}
  .hint{width:100%; max-width:1180px; text-align:center; color:#5c6475; font-size:12px; font-family:var(--mono); padding-bottom:30px}
  @media (max-width:640px){ .scenelabel{display:none} .tagline{display:none} }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><b>Warden</b> &mdash; Accountable Authorization</div>
    <div class="tagline">an animated explainer</div>
  </div>
  <div class="progress"><i id="bar"></i></div>

  <div class="stage" id="stage" title="click to advance">
    <svg id="viz" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ah" markerWidth="11" markerHeight="11" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/>
        </marker>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="halo"><stop offset="0%" stop-color="#ffd166" stop-opacity=".55"/><stop offset="100%" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
      </defs>
      <g id="scene"></g>
    </svg>
    <div class="chip" id="chip"></div>
    <div class="cap" id="cap"></div>
  </div>

  <div class="controls">
    <button class="btn" id="prev" title="previous (&larr;)">&#9664;</button>
    <button class="btn play" id="play" title="play / pause (space)">&#10073;&#10073;</button>
    <button class="btn" id="next" title="next (&rarr;)">&#9654;</button>
    <button class="btn" id="replay" title="replay scene (r)">&#8635;</button>
    <div class="dots" id="dots"></div>
    <div class="scenelabel" id="slabel"></div>
  </div>
  <div class="hint">space play/pause &nbsp;&middot;&nbsp; &larr; / &rarr; scenes &nbsp;&middot;&nbsp; r replay &nbsp;&middot;&nbsp; click canvas to advance</div>

<script>
const NS="http://www.w3.org/2000/svg";
const stage=document.getElementById("scene");
const capEl=document.getElementById("cap");
const chipEl=document.getElementById("chip");

function S(tag,attrs={},kids=[]){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs){ if(k==="text") n.textContent=attrs[k]; else n.setAttribute(k,attrs[k]); }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c&&n.appendChild(c));
  return n;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function anim(node,frames,opts={}){
  const a=node.animate(frames,Object.assign({fill:"both",easing:"cubic-bezier(.42,0,.2,1)"},opts));
  return a.finished.catch(()=>{});
}
function fadeIn(node,{dur=600,delay=0,dy=14,dx=0}={}){
  return anim(node,[{opacity:0,transform:`translate(${dx}px,${dy}px)`},{opacity:1,transform:"translate(0,0)"}],{duration:dur,delay});
}
function pop(node,{dur=480,delay=0}={}){
  return anim(node,[{opacity:0,transform:"scale(.7)"},{opacity:1,transform:"scale(1)"}],{duration:dur,delay,easing:"cubic-bezier(.3,1.5,.5,1)"});
}
function drawOn(path,{dur=850,delay=0,ease="ease-in-out"}={}){
  const L=path.getTotalLength();
  path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
  return anim(path,[{strokeDashoffset:L},{strokeDashoffset:0}],{duration:dur,delay,easing:ease});
}
function pulse(node,{scale=1.18,dur=900,color}={}){
  if(color){const r=node.querySelector?.("rect")||node;}
  return node.animate([{transform:"scale(1)"},{transform:`scale(${scale})`},{transform:"scale(1)"}],{duration:dur,easing:"ease-in-out"});
}
// primitives -------------------------------------------------------------
function T(x,y,str,{size=18,fill="var(--ink)",anchor="middle",cls="",weight=400,baseline="middle",ls=0}={}){
  const t=S("text",{x,y,"text-anchor":anchor,"dominant-baseline":baseline,"font-size":size,"font-weight":weight,fill,class:cls,text:str});
  if(ls)t.setAttribute("letter-spacing",ls);
  return t;
}
function box(cx,cy,w,h,label,{stroke="var(--blue)",fill="var(--panel)",text="var(--ink)",sub,rx=11,size=17}={}){
  const g=S("g");
  g.appendChild(S("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx,fill,stroke,"stroke-width":1.6}));
  g.appendChild(T(cx,sub?cy-7:cy,label,{size,fill:text,cls:"mono"}));
  if(sub) g.appendChild(T(cx,cy+13,sub,{size:11.5,fill:"var(--muted)",cls:"mono"}));
  g._c={cx,cy,w,h};
  return g;
}
function link(p1,p2,{color="var(--line)",width:wd=2,dash=false,arrow=true}={}){
  const p=S("path",{d:`M ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]}`,stroke:color,"stroke-width":wd,fill:"none","stroke-linecap":"round"});
  if(arrow)p.setAttribute("marker-end","url(#ah)");
  if(dash)p.setAttribute("stroke-dasharray","7 7");
  return p;
}
const rightOf=g=>[g._c.cx+g._c.w/2, g._c.cy];
const leftOf =g=>[g._c.cx-g._c.w/2, g._c.cy];
const topOf  =g=>[g._c.cx, g._c.cy-g._c.h/2];
const botOf  =g=>[g._c.cx, g._c.cy+g._c.h/2];

// caption / chrome -------------------------------------------------------
function setCap(html){ capEl.innerHTML=html; capEl.style.opacity = html? 1 : 0; }
function clearStage(){ while(stage.firstChild) stage.removeChild(stage.firstChild); }

/* ===================================================================== */
/*  SCENES                                                               */
/* ===================================================================== */
const scenes=[];
const SC=(title,hold,play)=>scenes.push({title,hold,play});

// 0 -- Title -------------------------------------------------------------
SC("Title",2600,async({g,cap,live})=>{
  const dot=S("circle",{cx:640,cy:300,r:9,fill:"var(--blue)",filter:"url(#glow)"});
  g.appendChild(dot);
  dot.animate([{opacity:.4},{opacity:1},{opacity:.4}],{duration:2600,iterations:Infinity,easing:"ease-in-out"});
  const t1=T(640,420,"Who is answerable?",{size:58,cls:"disp",weight:600}); g.appendChild(t1);
  const t2=T(640,478,"Accountable authorization for AI agent actions",{size:21,fill:"var(--muted)"}); g.appendChild(t2);
  pop(dot,{dur:700});
  await fadeIn(t1,{dur:900,delay:400,dy:18}); if(!live())return;
  await fadeIn(t2,{dur:700,delay:0,dy:10});
});

// 1 -- The action --------------------------------------------------------
SC("The action",2400,async({g,cap,live})=>{
  const agent=box(360,300,210,74,"agent:recon-bot-7",{stroke:"var(--blue)",sub:"an autonomous actor"});
  g.appendChild(agent); await pop(agent); if(!live())return;
  const ln=link(rightOf(agent),[720,300],{color:"var(--teal)",width:2.4}); g.appendChild(ln);
  await drawOn(ln,{dur:600}); if(!live())return;
  const act=box(910,300,300,82,"transfer_funds",{stroke:"var(--teal)",sub:"amount: $9,800  ->  account:456"});
  g.appendChild(act); await pop(act); if(!live())return;
  cap('An agent just moved <span class="g">$9,800</span> to <code>account:456</code> &mdash; on its own.');
  await wait(1500); if(!live())return;
  const q=T(640,150,"?",{size:96,cls:"disp",fill:"var(--gold)",weight:700});
  g.appendChild(q); await pop(q,{dur:700});
  cap('It executed cleanly. Now the only question that matters: <b>who is answerable for it?</b>');
});

// 2 -- The old flat world ------------------------------------------------
SC("The old model",2600,async({g,cap,live})=>{
  const flat=box(640,300,260,84,"--agent prod-agent",{stroke:"#5a6273",sub:"one flat name"});
  g.appendChild(flat); await pop(flat); if(!live())return;
  const allow=box(940,230,150,56,"allow",{stroke:"var(--green)",fill:"#11201a"});
  const deny =box(940,372,150,56,"deny",{stroke:"var(--red)",fill:"#221316"});
  g.appendChild(allow); g.appendChild(deny);
  const la=link(rightOf(flat),leftOf(allow),{color:"#2f3645"});
  const ld=link(rightOf(flat),leftOf(deny),{color:"#2f3645"});
  g.appendChild(la); g.appendChild(ld);
  await Promise.all([drawOn(la,{dur:500}),drawOn(ld,{dur:500}),fadeIn(allow,{delay:120}),fadeIn(deny,{delay:220})]);
  if(!live())return;
  cap('Classic authorization sees a single principal &mdash; <code>prod-agent</code> &mdash; matched on tool + one condition.');
  await wait(1700); if(!live())return;
  const know=T(360,470,"records WHAT ran",{size:18,fill:"var(--green)",cls:"mono"});
  const miss=T(360,505,"never WHO it acted for",{size:18,fill:"var(--red)",cls:"mono"});
  g.appendChild(know); g.appendChild(miss);
  await fadeIn(know,{dy:8}); await fadeIn(miss,{dy:8}); if(!live())return;
  // regulators
  const r1=box(900,470,200,46,"EU AI Act",{stroke:"var(--gold)",fill:"#1d1808",size:14});
  const r2=box(900,525,200,46,"MAS guidance",{stroke:"var(--gold)",fill:"#1d1808",size:14});
  g.appendChild(r1); g.appendChild(r2);
  await Promise.all([fadeIn(r1,{dx:14,dy:0}),fadeIn(r2,{dx:14,dy:0,delay:120})]);
  cap('Regulators don\'t ask "what can the agent do." They ask: <span class="g">which named human is answerable?</span>');
});

// 3 -- The reframe -------------------------------------------------------
SC("The reframe",2600,async({g,cap,live})=>{
  const a=T(640,300,'"What can the agent do?"',{size:38,cls:"disp",fill:"var(--muted)"});
  g.appendChild(a); await fadeIn(a,{dur:700}); if(!live())return;
  cap("The question that built every access-control system before agents...");
  await wait(1500); if(!live())return;
  await anim(a,[{opacity:1},{opacity:0,transform:"translateY(-26px)"}],{duration:600}); if(!live())return;
  const b=T(640,290,'"Which named human is answerable',{size:38,cls:"disp",fill:"var(--gold)"});
  const c=T(640,340,'for what this agent just did?"',{size:38,cls:"disp",fill:"var(--gold)"});
  g.appendChild(b); g.appendChild(c);
  await Promise.all([fadeIn(b,{dur:800,dy:24}),fadeIn(c,{dur:800,delay:150,dy:24})]);
  cap('...is the wrong question now. <b>This</b> is the one. It changes what a <i>principal</i> even is.');
});

// 4 -- Accountability is a chain ----------------------------------------
SC("A delegation chain",3200,async({g,cap,live})=>{
  const Y=300;
  const nodes=[
    box(150,Y,170,72,"human:alice",{stroke:"var(--gold)",fill:"#1d1808",sub:"accountable"}),
    box(420,Y,180,72,"service:recon",{stroke:"var(--blue)",sub:"delegate"}),
    box(700,Y,180,72,"agent:recon-7",{stroke:"var(--blue)",sub:"the actor"}),
    box(940,Y,120,72,"run",{stroke:"var(--teal)",size:16}),
    box(1140,Y,140,72,"action",{stroke:"var(--teal)",size:16}),
  ];
  cap('The principal isn\'t a name. It\'s a <b>chain</b>: <span class="g">human</span> &rarr; service &rarr; agent &rarr; run &rarr; action.');
  for(let i=0;i<nodes.length;i++){
    g.appendChild(nodes[i]); await pop(nodes[i],{dur:380});
    if(i<nodes.length-1){
      const ln=link(rightOf(nodes[i]),[nodes[i+1]._c.cx-nodes[i+1]._c.w/2,Y],{color:"#3a4150"});
      g.appendChild(ln); await drawOn(ln,{dur:320});
    }
    if(!live())return;
  }
  await wait(700); if(!live())return;
  cap('Read the <code>act</code> chain inward; the leaf is who\'s on the wire. The root is who answers for it.');
  // trace back glow
  const trace=S("path",{d:`M 1140 ${Y+60} L 1140 ${Y+92} L 150 ${Y+92} L 150 ${Y+40}`,stroke:"var(--gold)","stroke-width":3,fill:"none","stroke-linecap":"round","marker-end":"url(#ah)"});
  g.appendChild(trace); await drawOn(trace,{dur:1100,ease:"ease-in-out"}); if(!live())return;
  pulse(nodes[0],{scale:1.12,dur:900});
  await wait(700); if(!live())return;
  const fc=T(640,500,"no resolvable human  ->  fail closed",{size:20,cls:"mono",fill:"var(--red)"});
  g.appendChild(fc); await fadeIn(fc,{dy:10});
  cap('If a call can\'t resolve to a named human, Warden <span class="r">fails closed.</span> Accountability is non-optional.');
});

// 5 -- Authority is a narrowing -----------------------------------------
SC("Authority only narrows",3200,async({g,cap,live})=>{
  const cy=300;
  const c1=S("circle",{cx:500,cy,r:175,fill:"rgba(255,209,102,.07)",stroke:"var(--gold)","stroke-width":1.6});
  const c2=S("circle",{cx:660,cy,r:135,fill:"rgba(94,200,232,.07)",stroke:"var(--blue)","stroke-width":1.6});
  const c3=S("circle",{cx:600,cy:cy+70,r:105,fill:"rgba(82,214,192,.07)",stroke:"var(--teal)","stroke-width":1.6});
  g.appendChild(c1); g.appendChild(c2); g.appendChild(c3);
  g.appendChild(T(420,cy-150,"permissions(human)",{size:14,cls:"mono",fill:"var(--gold)",anchor:"middle"}));
  g.appendChild(T(760,cy-118,"grant(agent)",{size:14,cls:"mono",fill:"var(--blue)"}));
  g.appendChild(T(600,cy+190,"context guardrails",{size:14,cls:"mono",fill:"var(--teal)"}));
  await Promise.all([pop(c1,{dur:700}),pop(c2,{dur:700,delay:200}),pop(c3,{dur:700,delay:400})]);
  if(!live())return;
  cap('Three sets bound every call: what the <span class="g">human</span> may do, what the <span class="b">agent</span> was granted, and the <span class="t">live guardrails.</span>');
  await wait(1700); if(!live())return;
  // shrink to intersection
  await Promise.all([
    anim(c1,[{r:175},{r:120}],{duration:900}),
    anim(c2,[{r:135},{r:110}],{duration:900}),
    anim(c3,[{r:105},{r:95}],{duration:900}),
  ]); if(!live())return;
  const eff=S("circle",{cx:585,cy:cy+25,r:46,fill:"rgba(110,231,168,.18)",stroke:"var(--green)","stroke-width":2,filter:"url(#glow)"});
  g.appendChild(eff); await pop(eff,{dur:700}); if(!live())return;
  g.appendChild(T(585,cy+25,"effective",{size:14,cls:"mono",fill:"var(--green)"}));
  const f=T(640,560,"effective(agent) = grant & permissions(human) & guardrails",{size:19,cls:"mono",fill:"var(--ink)"});
  g.appendChild(f); await fadeIn(f,{dy:10});
  cap('Authority is the <b>intersection</b> &mdash; never a union. An agent can <span class="r">never</span> do more than the human it represents.');
});

// 6 -- Three layers ------------------------------------------------------
SC("RBAC / ABAC / ReBAC",3600,async({g,cap,live})=>{
  const plates=[
    {y:200,c:"var(--blue)",  t:"RBAC",  q:"what role?",            d:"ops.reconciler"},
    {y:320,c:"var(--teal)",  t:"ABAC",  q:"do attributes hold now?",d:"hour<18  &  jurisdiction=SG"},
    {y:440,c:"var(--purple)",t:"ReBAC", q:"related to THIS object?", d:"manages account:456"},
  ];
  for(const p of plates){
    const pg=S("g");
    pg.appendChild(S("rect",{x:430,y:p.y-32,width:420,height:64,rx:12,fill:"#12161d",stroke:p.c,"stroke-width":1.6}));
    pg.appendChild(T(455,p.y,p.t,{size:18,cls:"mono",fill:p.c,anchor:"start",weight:600}));
    pg.appendChild(T(640,p.y-7,p.q,{size:13.5,fill:"var(--muted)"}));
    pg.appendChild(T(640,p.y+12,p.d,{size:13,cls:"mono",fill:"var(--ink)"}));
    g.appendChild(pg); p.g=pg; await fadeIn(pg,{dy:16,dur:420}); if(!live())return;
  }
  cap('Three models, <b>composed as layers</b> &mdash; not chosen between. A call must clear all three.');
  await wait(1200); if(!live())return;
  // a passing call drops through
  const ball=S("circle",{cx:640,cy:120,r:13,fill:"var(--green)",filter:"url(#glow)"});
  g.appendChild(ball);
  for(const p of plates){
    await anim(ball,[{},{transform:`translateY(${p.y-120}px)`}],{duration:520,easing:"cubic-bezier(.4,0,.5,1)"}); if(!live())return;
    p.g.querySelector("rect").animate([{},{filter:"brightness(1.7)"},{}],{duration:500});
    const ok=T(880,p.y,"✓",{size:26,fill:"var(--green)",cls:"mono",anchor:"start"});
    g.appendChild(ok); pop(ok,{dur:300});
    await wait(160);
  }
  await anim(ball,[{transform:`translateY(${440-120}px)`},{transform:`translateY(${520-120}px)`,opacity:1}],{duration:380});
  if(!live())return;
  cap('Only <span class="p">ReBAC</span> can scope an action to <b>one specific object</b> &mdash; a set-membership check, no graph, no latency.');
  await wait(1500); if(!live())return;
  // 999 blocked at ReBAC
  const ball2=S("circle",{cx:760,cy:120,r:13,fill:"var(--gold)",filter:"url(#glow)"});
  g.appendChild(ball2);
  g.appendChild(T(760,108,"account:999",{size:12,cls:"mono",fill:"var(--gold)"}));
  await anim(ball2,[{},{transform:`translateY(${200-120}px)`}],{duration:440});
  await anim(ball2,[{transform:`translateY(${200-120}px)`},{transform:`translateY(${320-120}px)`}],{duration:440});
  if(!live())return;
  // hits ReBAC -> bounce, red
  ball2.setAttribute("fill","var(--red)");
  plates[2].g.querySelector("rect").animate([{},{stroke:"#ff6f6f",filter:"brightness(1.4)"},{}],{duration:600});
  await anim(ball2,[{transform:`translateY(${320-120}px)`},{transform:`translateY(${250-120}px)`}],{duration:380,easing:"ease-out"});
  const x=T(880,440,"✗",{size:26,fill:"var(--red)",cls:"mono",anchor:"start"}); g.appendChild(x); pop(x,{dur:300});
  cap('The agent can\'t touch <code>account:999</code> &mdash; that tuple was never in its token. <span class="r">Denied.</span>');
});

// 7 -- The signed token --------------------------------------------------

  g.appendChild(panel); await fadeIn(panel,{dur:600,dy:18}); if(!live())return;
  const rows=[

    ['"aud": "warden:prod-tenant-eu"',"var(--blue)"],
    ['"sub": "human:alice@org"',"var(--gold)"],

  }

  await wait(1200); if(!live())return;
  // seal
  const seal=S("g");
  seal.appendChild(S("circle",{cx:px+pw,cy:py+ph,r:40,fill:"#1d1808",stroke:"var(--gold)","stroke-width":2.5,filter:"url(#glow)"}));
  seal.appendChild(T(px+pw,py+ph,"🔒",{size:30}));
  g.appendChild(seal); await pop(seal,{dur:600}); if(!live())return;
  seal.querySelector("circle").animate([{},{transform:"scale(1.3)",opacity:.4},{transform:"scale(1)",opacity:1}],{duration:900});
  // verification checklist
  const checks=["signature vs issuer JWKS","exp / nbf window","aud == this Warden","leaf act.sub == wire id","non-empty accountable sub"];
  let cy2=py+40;
  for(const c of checks){
    const row=S("g");
    row.appendChild(T(960,cy2,"✓",{size:20,fill:"var(--green)",cls:"mono",anchor:"start"}));
    row.appendChild(T(990,cy2,c,{size:14,fill:"var(--ink)",anchor:"start",cls:"mono"}));
    g.appendChild(row); fadeIn(row,{dx:14,dy:0,dur:340}); cy2+=58; await wait(220); if(!live())return;

});

// 8 -- The decision gauntlet --------------------------------------------
SC("The decision gauntlet",3800,async({g,cap,live})=>{
  const gates=[
    "0  accountable sub?",
    "1  tool in scope?",
    "2  require_role?",
    "3  require_relation?",
    "4  when (ABAC) holds?",
    "5  within budget?",
    "6  require_approval?",
  ];
  const x0=470, w=380, top=120, gap=66;
  gates.forEach((t,i)=>{
    const y=top+i*gap; const gg=S("g");
    gg.appendChild(S("rect",{x:x0,y:y-22,width:w,height:44,rx:9,fill:"#11161d",stroke:"#2c3445","stroke-width":1.4}));
    gg.appendChild(T(x0+18,y,t,{size:15,cls:"mono",fill:"var(--ink)",anchor:"start"}));
    g.appendChild(gg); gg._y=y; gates[i]={g:gg,y};
    fadeIn(gg,{dx:0,dy:8,dur:260,delay:i*70});
  });
  await wait(700); if(!live())return;
  cap('Every <code>tools/call</code> runs a fixed gauntlet. Pass all gates &rarr; <span class="gr">allow.</span>');
  const ball=S("circle",{cx:x0+w+60,cy:top-50,r:14,fill:"var(--blue)",filter:"url(#glow)"});
  g.appendChild(ball); await pop(ball,{dur:300}); if(!live())return;
  // pass-through (gates 0..5 green)
  for(let i=0;i<6;i++){
    await anim(ball,[{},{transform:`translate(${(x0+w/2)-(x0+w+60)}px,${gates[i].y-(top-50)}px)`}],{duration:i?260:420});
    gates[i].g.querySelector("rect").animate([{},{stroke:"#6ee7a8"},{}],{duration:420});
    const ok=T(x0+w+18,gates[i].y,"✓",{size:20,fill:"var(--green)",cls:"mono",anchor:"start"}); g.appendChild(ok); pop(ok,{dur:240});
    ball.style.transform=`translate(${(x0+w/2)-(x0+w+60)}px,${gates[i].y-(top-50)}px)`;
    if(!live())return; await wait(60);
  }
  // gate 6 -> hold (amber)
  await anim(ball,[{},{transform:`translate(${(x0+w/2)-(x0+w+60)}px,${gates[6].y-(top-50)}px)`}],{duration:300});
  ball.style.transform=`translate(${(x0+w/2)-(x0+w+60)}px,${gates[6].y-(top-50)}px)`;
  ball.setAttribute("fill","var(--amber)");
  gates[6].g.querySelector("rect").animate([{},{stroke:"#f5a623"},{}],{duration:600});
  const hold=T(x0+w+18,gates[6].y,"hold",{size:14,fill:"var(--amber)",cls:"mono",anchor:"start"}); g.appendChild(hold); pop(hold);
  cap('A high-value call falls through to <span class="am">require_approval</span> &mdash; held for a human, not refused.');
  await wait(1500); if(!live())return;
  // approve -> release
  ball.setAttribute("fill","var(--green)");
  await anim(ball,[{transform:`translate(${(x0+w/2)-(x0+w+60)}px,${gates[6].y-(top-50)}px)`},{transform:`translate(${(x0+w/2)-(x0+w+60)}px,${(top+7*gap)-(top-50)}px)`}],{duration:500});
  if(!live())return;
  const od=S("g");
  od.appendChild(T(195,330,"combining rule",{size:13,fill:"var(--muted)",cls:"mono"}));
  od.appendChild(T(195,360,"deny",{size:20,fill:"var(--red)",cls:"mono",weight:600}));
  od.appendChild(T(195,388,">  require_approval",{size:16,fill:"var(--amber)",cls:"mono"}));
  od.appendChild(T(195,414,">  allow",{size:16,fill:"var(--green)",cls:"mono"}));
  g.appendChild(od); await fadeIn(od,{dx:-12,dy:0});
  cap('Across all gates, <span class="r">deny</span> overrides <span class="am">approval</span> overrides <span class="gr">allow</span> &mdash; and the order itself is an audit artifact.');
});

// 9 -- The env boundary --------------------------------------------------

  g.appendChild(signed); await fadeIn(signed,{dx:-14,dy:0}); if(!live())return;

// 10 -- Revocation -------------------------------------------------------
SC("Revocation",3200,async({g,cap,live})=>{
  const Y=360;
  const steps=[
    box(150,Y,150,64,"admin",{stroke:"var(--ink)",size:16}),
    box(370,Y,180,64,"control plane",{stroke:"var(--blue)",size:15}),
    box(610,Y,150,64,"PAUSE",{stroke:"var(--amber)",fill:"#1f1606",size:16}),
    box(840,Y,180,64,"update config",{stroke:"var(--blue)",size:15}),
    box(1090,Y,150,64,"RESUME",{stroke:"var(--green)",fill:"#11201a",size:16}),
  ];
  for(let i=0;i<steps.length;i++){
    g.appendChild(steps[i]); await pop(steps[i],{dur:300});

    if(!live())return;
  }
  cap('Revocation is an <b>administrative cycle,</b> not a live event stream: <span class="am">pause</span> &rarr; reload &rarr; <span class="gr">resume.</span>');
  await wait(1400); if(!live())return;
  // agent calls held during pause
  const agent=box(610,180,180,58,"agent calls",{stroke:"var(--blue)",size:15});
  g.appendChild(agent); await pop(agent); if(!live())return;
  const held=link(botOf(agent),topOf(steps[2]),{color:"var(--amber)",width:2.4,dash:true});
  g.appendChild(held); await drawOn(held,{dur:500});
  g.appendChild(T(640,150,"held by the proxy, regardless of agent behaviour",{size:13.5,fill:"var(--muted)",cls:"mono"}));
  cap('Crucially, "paused" is a <b>Warden-side state</b> &mdash; never an instruction the untrusted agent could choose to ignore.');
});

// 11 -- The audit chain --------------------------------------------------
SC("Tamper-evident record",3400,async({g,cap,live})=>{
  const blocks=[];
  const bx=150, by=300, bw=230, bh=150, gp=70;
  for(let i=0;i<3;i++){
    const x=bx+i*(bw+gp); const gg=S("g");
    gg.appendChild(S("rect",{x,y:by-bh/2,width:bw,height:bh,rx:12,fill:"#0f1219",stroke:"#2c3445","stroke-width":1.6}));
    gg.appendChild(T(x+bw/2,by-46,"#"+(1041+i),{size:12,cls:"mono",fill:"var(--muted)"}));
    gg.appendChild(T(x+bw/2,by-18,"accountable: alice",{size:13,cls:"mono",fill:"var(--gold)"}));
    gg.appendChild(T(x+bw/2,by+4,"act: [recon, recon-7]",{size:11.5,cls:"mono",fill:"var(--blue)"}));
    gg.appendChild(T(x+bw/2,by+24,"jti · matched · approval",{size:11.5,cls:"mono",fill:"var(--ink)"}));
    gg.appendChild(T(x+bw/2,by+50,"hash →",{size:12,cls:"mono",fill:"var(--green)"}));
    gg._x=x; gg._mid=by; gg._right=x+bw;
    g.appendChild(gg); blocks.push(gg);
    await fadeIn(gg,{dx:0,dy:14,dur:340}); if(!live())return;
    if(i>0){const ln=link([blocks[i-1]._right,by],[x,by],{color:"var(--green)",width:2.4}); g.insertBefore(ln,gg); drawOn(ln,{dur:300}); ln._chainlink=true; gg._inlink=ln;}
  }
  cap('Each action lands in a <b>hash chain</b> &mdash; the "who was accountable" fields are folded into every <code>row_hash</code>.');
  await wait(1600); if(!live())return;
  // tamper block 1
  const tamper=blocks[1];
  const t=tamper.querySelectorAll("text")[1];
  t.textContent="accountable: mallory"; t.setAttribute("fill","var(--red)");
  tamper.querySelector("rect").animate([{},{stroke:"#ff6f6f",filter:"brightness(1.4)"},{stroke:"#ff6f6f"}],{duration:600,fill:"forwards"});
  pop(t,{dur:400}); if(!live())return;
  cap('Rewrite a single field &mdash; <span class="r">alice &rarr; mallory</span> &mdash; and that block\'s hash no longer matches...');
  await wait(1400); if(!live())return;
  // downstream link breaks
  blocks[2]._inlink.setAttribute("stroke","var(--red)");
  blocks[2]._inlink.animate([{opacity:1},{opacity:.2},{opacity:1}],{duration:500,iterations:3});
  const broke=T(640,500,"chain broken — every downstream link invalidated",{size:18,cls:"mono",fill:"var(--red)"});
  g.appendChild(broke); await fadeIn(broke,{dy:10});
  cap('...and <b>every downstream link breaks.</b> The accountability record is tamper-<span class="gr">evident</span>, not merely append-only.');
});

  g.appendChild(w); await fadeIn(w,{dy:18,dur:900}); if(!live())return;
  const sub=T(640,520,"the action control plane for AI agents",{size:17,fill:"var(--muted)"});
  g.appendChild(sub); await fadeIn(sub,{dy:8});
});

/* ===================================================================== */
/*  CONTROLLER                                                            */
/* ===================================================================== */
const RUN={token:0, playing:true, i:0, finished:false};
const bar=document.getElementById("bar");
const dotsEl=document.getElementById("dots");
const slabel=document.getElementById("slabel");
const playBtn=document.getElementById("play");

scenes.forEach((s,i)=>{
  const d=document.createElement("button"); d.className="dot"; d.title=s.title;
  d.onclick=()=>go(i); dotsEl.appendChild(d); s._dot=d;
});

function chrome(i){
  bar.style.width=((i)/(scenes.length-1)*100)+"%";
  chipEl.innerHTML=`<b>${String(i+1).padStart(2,"0")}</b> / ${scenes.length} &middot; ${scenes[i].title}`;
  slabel.innerHTML=`<b>${scenes[i].title}</b>`;
  scenes.forEach((s,j)=>s._dot.classList.toggle("on",j===i));
}
function setPlayIcon(){ playBtn.innerHTML = RUN.playing ? "&#10073;&#10073;" : "&#9654;"; }

async function go(i){
  i=Math.max(0,Math.min(scenes.length-1,i));
  const t=++RUN.token; RUN.i=i; RUN.finished=false;
  clearStage(); setCap(""); chrome(i);
  const live=()=>t===RUN.token;
  const cap=html=>{ if(live()) setCap(html); };
  try{ await scenes[i].play({g:stage,cap,live}); }catch(e){ console.warn(e); }
  if(!live()) return;
  RUN.finished=true;
  if(RUN.playing){
    await wait(scenes[i].hold||1600);
    if(live() && RUN.playing){
      if(i<scenes.length-1) go(i+1);
      else { RUN.playing=false; setPlayIcon(); }
    }
  }
}
function setPlaying(p){
  RUN.playing=p; setPlayIcon();
  if(p && RUN.finished){
    if(RUN.i<scenes.length-1) go(RUN.i+1);
    else go(RUN.i);
  }
}

document.getElementById("next").onclick=()=>go(RUN.i+1);
document.getElementById("prev").onclick=()=>go(RUN.i-1);
document.getElementById("replay").onclick=()=>go(RUN.i);
playBtn.onclick=()=>setPlaying(!RUN.playing);
document.getElementById("stage").onclick=()=>go(RUN.i+1);
document.addEventListener("keydown",e=>{
  if(e.key===" "){e.preventDefault(); setPlaying(!RUN.playing);}
  else if(e.key==="ArrowRight") go(RUN.i+1);
  else if(e.key==="ArrowLeft") go(RUN.i-1);
  else if(e.key==="r"||e.key==="R") go(RUN.i);
  else if(e.key==="Home") go(0);
});

setPlayIcon();
go(0);
</script>
