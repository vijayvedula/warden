[book]
title = "Warden User Guide"
description = "Use and integrate Warden — an action control plane for AI agents — across LangGraph, AWS Bedrock, Databricks, Google ADK, and Azure AI."
authors = ["Warden contributors"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
# The guide is served under /guide/ on GitHub Pages (explainers are at the root).
site-url = "/warden/guide/"
git-repository-url = "https://github.com/vijayvedula/warden"
edit-url-template = "https://github.com/vijayvedula/warden/edit/main/docs/guide/{path}"
additional-css = ["theme/warden.css"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
