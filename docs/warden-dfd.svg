<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180">
  <defs>
    <style>
      .title { font: 800 36px 'Segoe UI', Arial, sans-serif; fill:#16243f; }
      .sub   { font: 400 16px 'Segoe UI', Arial, sans-serif; fill:#51607a; }
      .sec   { font: 700 13px 'Segoe UI', Arial, sans-serif; fill:#51607a; letter-spacing:1.5px; }
      .ent   { font: 700 15px 'Segoe UI', Arial, sans-serif; fill:#16243f; }
      .pid   { font: 800 14px 'Segoe UI', Arial, sans-serif; fill:#2d3a5e; }
      .pname { font: 700 14px 'Segoe UI', Arial, sans-serif; fill:#16243f; }
      .body  { font: 400 12px 'Segoe UI', Arial, sans-serif; fill:#28384f; }
      .flowl { font: 400 12px 'Segoe UI', Arial, sans-serif; fill:#2a3850; }
      .store { font: 700 13px 'Segoe UI', Arial, sans-serif; fill:#5a3a12; }
      .c { text-anchor:middle; dominant-baseline:middle; }
      .extbox { fill:#eef2f8; stroke:#5b6c92; stroke-width:2; }
      .proc   { fill:#dde7f3; stroke:#2d3a5e; stroke-width:2; }
      .procc  { fill:#e7f1da; stroke:#5f7d3f; stroke-width:2; }
      .dstore { fill:#fbeeda; stroke:#9a6b1e; stroke-width:2; }
      .flow { stroke:#2a3850; stroke-width:1.9; fill:none; }
      .dflow { stroke:#9a6b1e; stroke-width:1.8; fill:none; stroke-dasharray:6 5; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 z" fill="#2a3850"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3.5 L0,7 z" fill="#9a6b1e"/></marker>
  </defs>
  <rect width="2000" height="1180" fill="#ffffff"/>
  <text x="55" y="52" class="title">Warden — Data Flow Diagram (Level 1)</text>
  <text x="57" y="80" class="sub">External entities ▢ · processes ◯ · data stores ▭ (open) · labeled data flows · per tools/call</text>

  <!-- ===== External entities (edges) ===== -->
  <rect x="40" y="150" width="250" height="92" class="extbox"/><text x="165" y="186" class="ent c">E1 · Agent</text><text x="165" y="210" class="body c">MCP client</text><text x="165" y="228" class="body c">(carries token)</text>
  <rect x="40" y="470" width="250" height="92" class="extbox"/><text x="165" y="506" class="ent c">E2 · Identity</text><text x="165" y="530" class="body c">Provider / JWKS</text>
  <rect x="40" y="800" width="250" height="92" class="extbox"/><text x="165" y="836" class="ent c">E3 · Human</text><text x="165" y="860" class="body c">approver</text>
  <rect x="1710" y="150" width="250" height="92" class="extbox"/><text x="1835" y="186" class="ent c">E5 · Upstream</text><text x="1835" y="210" class="body c">MCP server /</text><text x="1835" y="228" class="body c">tools &amp; backends</text>
  <rect x="1710" y="800" width="250" height="92" class="extbox"/><text x="1835" y="836" class="ent c">E4 · Admin</text><text x="1835" y="860" class="body c">/ SecOps</text>

  <!-- ===== Processes ===== -->
  <ellipse cx="560" cy="300" rx="120" ry="74" class="procc"/><text x="560" y="282" class="pid c">P1</text><text x="560" y="302" class="pname c">Verify token</text><text x="560" y="322" class="body c">&amp; freshness</text>
  <ellipse cx="560" cy="560" rx="120" ry="74" class="proc"/><text x="560" y="542" class="pid c">P2</text><text x="560" y="562" class="pname c">Pause &amp;</text><text x="560" y="582" class="body c">revocation gate</text>
  <ellipse cx="1000" cy="430" rx="125" ry="80" class="proc"/><text x="1000" y="410" class="pid c">P3</text><text x="1000" y="432" class="pname c">Evaluate policy</text><text x="1000" y="452" class="body c">RBAC·ABAC·ReBAC</text>
  <ellipse cx="1000" cy="720" rx="120" ry="74" class="procc"/><text x="1000" y="702" class="pid c">P4</text><text x="1000" y="722" class="pname c">Hold &amp; verify</text><text x="1000" y="742" class="body c">approval</text>
  <ellipse cx="1450" cy="430" rx="120" ry="74" class="proc"/><text x="1450" y="412" class="pid c">P5</text><text x="1450" y="432" class="pname c">Forward to</text><text x="1450" y="452" class="body c">upstream</text>
  <ellipse cx="1000" cy="980" rx="120" ry="70" class="procc"/><text x="1000" y="962" class="pid c">P6</text><text x="1000" y="982" class="pname c">Record audit</text><text x="1000" y="1001" class="body c">+ anchor</text>
  <ellipse cx="1450" cy="720" rx="110" ry="66" class="proc"/><text x="1450" y="704" class="pid c">P7</text><text x="1450" y="722" class="pname c">Emit metrics</text>
  <ellipse cx="1700" cy="560" rx="118" ry="72" class="procc"/><text x="1700" y="540" class="pid c">P8</text><text x="1700" y="560" class="pname c">Ship to sinks</text><text x="1700" y="580" class="body c">OCSF · CAEP SET</text>

  <!-- E6 sink subscribers -->
  <rect x="1710" y="300" width="250" height="86" class="extbox"/><text x="1835" y="333" class="ent c">E6 · SIEM / SSF</text><text x="1835" y="360" class="body c">subscribers</text>
  <!-- P8 reads the audit WAL (D2) and ships; blocking sinks fire from P6 -->
  <path d="M1300 1000 Q1620 820 1690 612" class="dflow" marker-end="url(#ad)"/><text x="1470" y="900" class="flowl">tail audit WAL (fail-safe)</text>
  <path d="M1700 488 L1760 386" class="flow" marker-end="url(#a)"/><text x="1742" y="450" class="flowl">signed events</text>
  <path d="M1085 940 Q1450 760 1600 600" class="flow" marker-end="url(#a)"/><text x="1300" y="800" class="flowl">blocking: ship-before-act</text>

  <!-- ===== Data stores ===== -->
  <g>
    <rect x="700" y="150" width="240" height="40" class="dstore"/><line x1="700" y1="150" x2="700" y2="190" stroke="#9a6b1e" stroke-width="3"/><text x="824" y="174" class="store c">D1 policy.toml</text>
    <rect x="1180" y="980" width="240" height="40" class="dstore"/><line x1="1180" y1="980" x2="1180" y2="1020" stroke="#9a6b1e" stroke-width="3"/><text x="1304" y="1004" class="store c">D2 audit.jsonl</text>
    <rect x="700" y="1040" width="240" height="40" class="dstore"/><line x1="700" y1="1040" x2="700" y2="1080" stroke="#9a6b1e" stroke-width="3"/><text x="824" y="1064" class="store c">D3 anchor.jsonl</text>
    <rect x="700" y="800" width="240" height="40" class="dstore"/><line x1="700" y1="800" x2="700" y2="840" stroke="#9a6b1e" stroke-width="3"/><text x="824" y="824" class="store c">D4 approvals.json</text>
    <rect x="1180" y="300" width="240" height="40" class="dstore"/><line x1="1180" y1="300" x2="1180" y2="340" stroke="#9a6b1e" stroke-width="3"/><text x="1304" y="324" class="store c">D5 budget.json</text>
    <rect x="290" y="650" width="250" height="40" class="dstore"/><line x1="290" y1="650" x2="290" y2="690" stroke="#9a6b1e" stroke-width="3"/><text x="415" y="674" class="store c">D6 revocations.jsonl</text>
    <rect x="290" y="710" width="250" height="40" class="dstore"/><line x1="290" y1="710" x2="290" y2="750" stroke="#9a6b1e" stroke-width="3"/><text x="415" y="734" class="store c">D7 control file</text>
    <rect x="1600" y="800" width="240" height="40" class="dstore"/><line x1="1600" y1="800" x2="1600" y2="840" stroke="#9a6b1e" stroke-width="3"/><text x="1720" y="824" class="store c">D8 metrics.json</text>
  </g>

  <!-- ===== Flows ===== -->
  <!-- E1 -> P1 -->
  <path d="M290 230 Q400 250 452 280" class="flow" marker-end="url(#a)"/><text x="330" y="248" class="flowl">tools/call + token</text>
  <!-- E2 -> P1 -->
  <path d="M290 500 Q380 420 470 350" class="flow" marker-end="url(#a)"/><text x="300" y="430" class="flowl">JWKS keys</text>
  <!-- P1 -> P2 -->
  <path d="M560 374 L560 486" class="flow" marker-end="url(#a)"/><text x="568" y="436" class="flowl">verified principal</text>
  <!-- D7 -> P2 ; D6 -> P2 -->
  <path d="M540 690 Q560 640 560 634" class="dflow" marker-end="url(#ad)"/><text x="430" y="700" class="flowl">control state</text>
  <path d="M540 660 Q620 620 650 600" class="dflow" marker-end="url(#ad)"/><text x="560" y="660" class="flowl">revoked set</text>
  <!-- P2 -> P3 -->
  <path d="M660 520 Q800 470 882 452" class="flow" marker-end="url(#a)"/><text x="690" y="475" class="flowl">allowed to evaluate</text>
  <!-- D1 -> P3 -->
  <path d="M824 190 Q900 280 970 352" class="dflow" marker-end="url(#ad)"/><text x="846" y="250" class="flowl">rules</text>
  <!-- D5 <-> P3 -->
  <path d="M1180 322 Q1110 360 1080 380" class="dflow" marker-end="url(#ad)"/><text x="1120" y="320" class="flowl">budget read</text>
  <!-- P3 -> P4 (require_approval) -->
  <path d="M1000 510 L1000 646" class="flow" marker-end="url(#a)"/><text x="1010" y="585" class="flowl">require_approval</text>
  <!-- E3 <-> P4 ; D4 <-> P4 -->
  <path d="M290 850 Q650 800 882 745" class="flow" marker-end="url(#a)"/><text x="470" y="812" class="flowl">approve (signed assertion)</text>
  <path d="M880 820 Q920 780 940 768" class="dflow" marker-end="url(#ad)"/><text x="800" y="800" class="flowl">pending / status</text>
  <!-- P3 -> P5 (allow) -->
  <path d="M1125 430 L1330 430" class="flow" marker-end="url(#a)"/><text x="1170" y="418" class="flowl">allow</text>
  <!-- P4 -> P5 (approved) -->
  <path d="M1110 690 Q1300 600 1380 496" class="flow" marker-end="url(#a)"/><text x="1230" y="640" class="flowl">approved → execute</text>
  <!-- P5 <-> E5 -->
  <path d="M1570 420 Q1660 360 1720 250" class="flow" marker-end="url(#a)"/><text x="1600" y="350" class="flowl">forward call</text>
  <path d="M1735 235 Q1640 360 1575 412" class="flow" marker-end="url(#a)"/><text x="1660" y="300" class="flowl">tool result</text>
  <!-- P5 -> P6 ; P3 -> P6 ; P4 -> P6 -->
  <path d="M1430 504 Q1250 800 1090 920" class="flow" marker-end="url(#a)"/><text x="1290" y="760" class="flowl">executed outcome</text>
  <path d="M980 510 Q930 760 985 910" class="flow" marker-end="url(#a)"/><text x="905" y="720" class="flowl">deny / hold outcome</text>
  <!-- P6 -> D2 ; P6 -> D3 -->
  <path d="M1120 980 L1180 1000" class="dflow" marker-end="url(#ad)"/><text x="1120" y="965" class="flowl">append (chain)</text>
  <path d="M905 1010 L940 1055" class="dflow" marker-end="url(#ad)"/><text x="800" y="1035" class="flowl">checkpoint</text>
  <!-- P6 -> P7 -> D8 -->
  <path d="M1110 950 Q1300 840 1360 766" class="flow" marker-end="url(#a)"/><text x="1240" y="880" class="flowl">decision event</text>
  <path d="M1540 740 Q1600 780 1600 808" class="dflow" marker-end="url(#ad)"/><text x="1560" y="775" class="flowl">snapshot</text>
  <!-- P5 -> E1 response -->
  <path d="M1340 410 Q800 120 300 200" class="flow" marker-end="url(#a)"/><text x="820" y="120" class="flowl">JSON-RPC response → agent</text>
  <!-- Admin flows: E4 -> D6, D7, D1 -->
  <path d="M1710 846 Q1100 1120 540 740" class="dflow" marker-end="url(#ad)"/><text x="1180" y="1110" class="flowl">revoke event → D6 · pause → D7 · policy update → D1</text>

  <!-- Legend -->
  <rect x="40" y="1098" width="1300" height="60" rx="8" fill="#fff" stroke="#cdd8e8" stroke-width="1.4"/>
  <text x="58" y="1122" class="sec">LEGEND</text>
  <rect x="58" y="1132" width="22" height="18" class="extbox"/><text x="88" y="1142" class="body">External entity</text>
  <ellipse cx="240" cy="1141" rx="22" ry="13" class="proc"/><text x="275" y="1142" class="body">Process</text>
  <ellipse cx="390" cy="1141" rx="22" ry="13" class="procc"/><text x="425" y="1142" class="body">Security process</text>
  <rect x="560" y="1132" width="40" height="18" class="dstore"/><text x="612" y="1142" class="body">Data store</text>
  <line x1="730" y1="1141" x2="775" y2="1141" class="flow" marker-end="url(#a)"/><text x="785" y="1145" class="body">data flow</text>
  <line x1="900" y1="1141" x2="945" y2="1141" class="dflow" marker-end="url(#ad)"/><text x="955" y="1145" class="body">store read / write</text>
</svg>
