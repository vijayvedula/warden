<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="t d">
  <title id="t">Where Warden sits in the composition of an AI agent</title>
  <desc id="d">Warden is an action control plane placed on the tool-call path between the agent's Tools and Gateways layer and external services: it gates (allow/deny/require-approval), routes approvals to a human, and records every decision in a tamper-evident audit chain feeding observability.</desc>
  <defs>
    <linearGradient id="noteFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="1" stop-color="#fff0b8"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="aK" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 z" fill="#111"/></marker>
    <marker id="aG" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 z" fill="#2e8b3d"/></marker>
    <marker id="aR" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 z" fill="#c0392b"/></marker>
    <marker id="aA" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 z" fill="#b9770e"/></marker>
    <marker id="aGr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5.5 L0 11 z" fill="#666"/></marker>
    <style><![CDATA[
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #0a0a0a; }
      .sub { font-family: Arial, sans-serif; font-size: 16px; fill: #555; }
      .h { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #111; }
      .txt { font-family: Arial, sans-serif; font-size: 14px; fill: #111; }
      .small { font-family: Arial, sans-serif; font-size: 12.5px; fill: #111; }
      .tiny { font-family: Arial, sans-serif; font-size: 11.5px; fill: #444; }
      .bold { font-weight: 700; }
      .box { fill: #fff; stroke: #111; stroke-width: 1.8; filter: url(#sh); }
      .note { fill: url(#noteFill); stroke: #111; stroke-width: 1.6; filter: url(#sh); }
      .bnd { fill: none; stroke: #111; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .ext { fill: none; stroke: #666; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .aK { stroke:#111; stroke-width:1.8; fill:none; marker-end:url(#aK); }
      .aG { stroke:#2e8b3d; stroke-width:2; fill:none; marker-end:url(#aG); }
      .aR { stroke:#c0392b; stroke-width:2; fill:none; marker-end:url(#aR); }
      .aA { stroke:#b9770e; stroke-width:2; fill:none; marker-end:url(#aA); }
      .aGr { stroke:#666; stroke-width:1.6; fill:none; marker-end:url(#aGr); }
    ]]></style>
  </defs>

  <rect width="1600" height="920" fill="#fff"/>
  <text x="40" y="50" class="title">Where Warden sits in your agent</text>
  <text x="40" y="80" class="sub">An action control plane on the tool-call path — gate · approve · record. Nothing reaches the outside world unchecked or unrecorded.</text>

  <!-- ===================== AGENT BOUNDARY ===================== -->
  <rect class="bnd" x="40" y="120" width="360" height="600" rx="6"/>
  <text x="220" y="142" text-anchor="middle" class="h">Agent Network boundary</text>

  <rect class="box" x="70" y="156" width="300" height="64" rx="4"/>
  <text x="220" y="194" text-anchor="middle" class="h">Planner / Policy (Coordinator)</text>
  <rect class="box" x="70" y="240" width="300" height="64" rx="4"/>
  <text x="220" y="278" text-anchor="middle" class="h">Reasoning Engine(s)</text>
  <rect class="box" x="70" y="324" width="300" height="64" rx="4"/>
  <text x="220" y="362" text-anchor="middle" class="h">Memory &amp; Knowledge</text>
  <rect class="box" x="70" y="408" width="300" height="66" rx="4" stroke="#0b63c7" stroke-width="2.4"/>
  <text x="220" y="441" text-anchor="middle" class="h">Tools &amp; Gateways</text>
  <text x="220" y="461" text-anchor="middle" class="small">(Skill Layer — egress point)</text>
  <text x="220" y="700" text-anchor="middle" class="tiny">— from your composition of an agent —</text>

  <!-- request out of the agent -->
  <path class="aK" d="M370 441 C 420 441, 430 360, 462 352"/>
  <text x="416" y="402" text-anchor="middle" class="small bold">tools/call (MCP)</text>

  <!-- ===================== HUMAN ===================== -->
  <rect class="box" x="556" y="150" width="392" height="56" rx="4"/>
  <text x="752" y="183" text-anchor="middle" class="h">Human approver — approve / deny held actions</text>

  <!-- ===================== WARDEN ===================== -->
  <rect class="box" x="462" y="238" width="486" height="384" rx="5"/>
  <rect x="462" y="238" width="486" height="48" rx="5" fill="#16324f"/>
  <rect x="462" y="270" width="486" height="16" fill="#16324f"/>
  <text x="705" y="269" text-anchor="middle" class="h" fill="#fff" font-size="18">WARDEN — Action Control Plane (MCP proxy)</text>
  <text x="705" y="305" text-anchor="middle" class="tiny">= your Safety / Security / Governance + Telemetry / Observability columns, enforced on every action</text>

  <text x="486" y="334" class="txt bold">1 · Intercept every tools/call</text>
  <rect x="486" y="346" width="438" height="40" rx="4" fill="#eef3fb" stroke="#0b63c7" stroke-width="1.4"/>
  <text x="705" y="371" text-anchor="middle" class="txt bold">2 · Policy: allow · deny · require-approval</text>

  <text x="486" y="408" class="txt bold">3 · Outcome</text>
  <circle cx="498" cy="430" r="6" fill="#2e8b3d"/>
  <text x="514" y="435" class="txt"><tspan class="bold">ALLOW</tspan> &#8594; forward to the tool / service</text>
  <circle cx="498" cy="460" r="6" fill="#c0392b"/>
  <text x="514" y="465" class="txt"><tspan class="bold">DENY</tspan> &#8594; blocked; tool-error returned to agent</text>
  <circle cx="498" cy="490" r="6" fill="#b9770e"/>
  <text x="514" y="495" class="txt"><tspan class="bold">REQUIRE-APPROVAL</tspan> &#8594; hold for a human</text>

  <line x1="486" y1="516" x2="924" y2="516" stroke="#ccc" stroke-width="1.2"/>
  <text x="705" y="544" text-anchor="middle" class="txt bold">4 · Record every decision &#8594; tamper-evident audit chain</text>
  <text x="705" y="566" text-anchor="middle" class="small">policy · args · decision · outcome · approver · prev-hash &#8594; row-hash</text>
  <text x="705" y="596" text-anchor="middle" class="tiny">budgets &amp; rate limits · arg conditions (e.g. amount &gt; $1000) · wildcard rules</text>

  <!-- approval interaction (amber) -->
  <path class="aA" d="M690 238 L690 208"/>
  <text x="660" y="226" text-anchor="middle" class="small bold" fill="#b9770e">hold</text>
  <path class="aA" d="M812 206 L812 236"/>
  <text x="852" y="226" text-anchor="middle" class="small bold" fill="#b9770e">decide</text>

  <!-- deny back to agent (red) -->
  <path class="aR" d="M462 460 C 430 460, 420 512, 372 506"/>
  <text x="408" y="528" text-anchor="middle" class="small bold" fill="#c0392b">blocked</text>

  <!-- allow forward (green) -->
  <path class="aG" d="M948 430 C 985 430, 990 240, 1042 224"/>
  <text x="990" y="330" text-anchor="middle" class="small bold" fill="#2e8b3d">allowed</text>

  <!-- audit down + to observability -->
  <path class="aGr" d="M705 622 L705 650"/>
  <rect class="box" x="462" y="650" width="486" height="58" rx="4"/>
  <text x="705" y="676" text-anchor="middle" class="h">Tamper-evident audit chain</text>
  <text x="705" y="696" text-anchor="middle" class="small">hash-linked record of prompts, tool IO &amp; decisions</text>
  <path class="aGr" d="M948 679 L1006 679"/>

  <!-- ===================== EXTERNAL BOUNDARY ===================== -->
  <rect class="ext" x="1010" y="150" width="550" height="472" rx="6"/>
  <text x="1285" y="142" text-anchor="middle" class="h" fill="#444">External to Agent — Network boundary</text>

  <rect class="box" x="1042" y="184" width="486" height="62" rx="4"/>
  <text x="1285" y="210" text-anchor="middle" class="h">MCP tool servers (Warden's upstreams)</text>
  <text x="1285" y="231" text-anchor="middle" class="small">filesystem · database · payments · http · domain SDKs</text>

  <rect class="box" x="1042" y="282" width="486" height="78" rx="4"/>
  <text x="1285" y="316" text-anchor="middle" class="h">External Services &amp; Data Sources</text>
  <text x="1285" y="340" text-anchor="middle" class="small">CRM · Payments · Analytics · Search …</text>

  <rect class="box" x="1042" y="396" width="486" height="78" rx="4"/>
  <text x="1285" y="430" text-anchor="middle" class="h">External Datastores</text>
  <text x="1285" y="454" text-anchor="middle" class="small">vector DB · RDBMS · Object Storage …</text>

  <path class="aGr" d="M1285 246 L1285 280"/>
  <path class="aGr" d="M1285 360 L1285 394"/>

  <!-- Observability (their right column / bottom-right note) -->
  <rect class="box" x="1010" y="650" width="550" height="58" rx="4"/>
  <text x="1285" y="676" text-anchor="middle" class="h">Telemetry &amp; Observability</text>
  <text x="1285" y="696" text-anchor="middle" class="small">signed audit log of tool IO, decisions, reply hashes</text>

  <!-- ===================== MAPPING NOTE ===================== -->
  <rect class="note" x="40" y="740" width="930" height="150" rx="6"/>
  <text x="60" y="770" class="txt"><tspan class="bold">Warden is the concrete enforcement point for two cross-cutting concerns already in your composition:</tspan></text>
  <text x="60" y="800" class="txt"><tspan class="bold" fill="#16324f">Safety / Security / Governance</tspan> &#8594; tool-permission guardrails: allow-list, scopes, rate limits, approvals, data residency.</text>
  <text x="60" y="828" class="txt"><tspan class="bold" fill="#16324f">Telemetry / Observability</tspan> &#8594; signed, tamper-evident audit of every decision (try: edit a log line, re-run verify — it's caught).</text>
  <text x="60" y="862" class="txt">It applies them at the <tspan class="bold">action boundary</tspan> — between Tools &amp; Gateways and External Services — so the agent can&#8217;t act on the outside</text>
  <text x="60" y="882" class="txt">world without being checked and recorded. Same hash-chained audit primitive as the token vault.</text>

  <!-- Legend -->
  <rect class="box" x="1010" y="740" width="550" height="150" rx="6"/>
  <text x="1030" y="768" class="h">Legend</text>
  <circle cx="1040" cy="792" r="6" fill="#2e8b3d"/><text x="1056" y="797" class="small">ALLOW — call forwarded to the tool / service</text>
  <circle cx="1040" cy="818" r="6" fill="#c0392b"/><text x="1056" y="823" class="small">DENY — blocked before reaching the upstream</text>
  <circle cx="1040" cy="844" r="6" fill="#b9770e"/><text x="1056" y="849" class="small">REQUIRE-APPROVAL — held for a human reviewer</text>
  <line x1="1034" y1="868" x2="1048" y2="868" class="aGr"/><text x="1056" y="873" class="small">audit / observability flow</text>
</svg>
