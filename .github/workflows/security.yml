name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches newly-disclosed advisories

# Least privilege at the top level; the codeql job elevates its own scopes.
permissions:
  contents: read

jobs:
  # RUSTSEC advisories on the locked dependency tree.
  # RUSTSEC-2023-0071 (rsa Marvin) is accepted: verification-only, no RSA
  # private keys held -- see deny.toml and docs/threat-model.md Sec 11.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --ignore RUSTSEC-2023-0071

  # Supply-chain policy: advisories + licenses + bans + sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check advisories bans licenses sources

  # Static analysis (CodeQL). Rust uses build-mode: none -- CodeQL extracts from
  # source + `cargo metadata` rather than tracing a compile.
  #
  # Only runs on a PUBLIC repo: uploading results needs GitHub code scanning,
  # which requires public visibility (or GitHub Advanced Security). While private
  # the upload fails with "Code scanning is not enabled", so we skip the job
  # rather than fail the workflow. It activates automatically once public.
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v3

  # Clippy as a security/quality gate (deny warnings).
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --all-targets -- -D warnings

  # Short fuzzing smoke on the parsers (full corpus runs in OSS-Fuzz).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-fuzz
      - name: Fuzz parsers (60s each)
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done
