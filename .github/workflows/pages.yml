name: Docs (GitHub Pages)

# Publishes the Warden User Guide (mdBook) at the Pages root, with the curated
# explainer decks bundled under /explainers/. Only committed files are deployed,
# so excluded explainers never leak.
#
# One-time setup after making the repo public:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site then serves at https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "docs/explainers/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: latest
      - name: Build the user guide
        run: mdbook build docs/guide
      - name: Bundle explainers under /explainers
        run: cp -r docs/explainers docs/guide/book/explainers
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/guide/book
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
