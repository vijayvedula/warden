name: Docs (GitHub Pages)

# Publishes the curated explainer decks at the Pages root, and the Warden User
# Guide (mdBook) under /guide/. Only committed files are deployed, so excluded
# explainers never leak.
#   /        -> explainers gallery + decks
#   /guide/  -> user guide
#
# One-time setup after making the repo public:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site then serves at https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "docs/explainers/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # OIDC for deploy-pages
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: latest
      - name: Build the user guide
        run: mdbook build docs/guide
      - name: Assemble site (explainers at root, guide under /guide)
        run: |
          mkdir -p _site/guide
          cp -a docs/explainers/.  _site/         # explainer decks + gallery -> site root
          cp -a docs/guide/book/.  _site/guide/   # mdBook user guide -> /guide/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
