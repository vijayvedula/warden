name: Explainers (GitHub Pages)

# Publishes the curated explainer decks in docs/explainers/ to GitHub Pages.
# Only committed files are deployed, so excluded explainers never leak.
#
# One-time setup after making the repo public:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site then serves at https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths: ["docs/explainers/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/explainers
      - id: deployment
        uses: actions/deploy-pages@v4
