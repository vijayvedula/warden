name: ✨ Feature request
description: Propose a new capability, policy condition, adapter, or improvement.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the solution. What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like Warden to do. API/CLI/policy shape if you have one in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or prior art.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Policy model
        - Identity / crypto
        - Audit / evidence
        - Transport / deployment
        - Python SDK / a new platform adapter
        - Docs / examples
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this via a pull request.
