[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warden-sdk"
version = "0.1.0"
description = "Client SDK for Warden — build and sign canonical Warden delegation tokens, and route agent frameworks through the Warden MCP proxy."
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-FSL-1.1-ALv2"
license-files = ["LICENSE", "LICENSE-APACHE"]
keywords = ["warden", "mcp", "ai-agents", "authorization", "delegation", "rfc8693"]
authors = [{ name = "Warden contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# Core is pure-stdlib on purpose: the dev-envelope token and the conformance
# kit have zero third-party dependencies, so they run anywhere Warden runs.
dependencies = []

[project.optional-dependencies]
# Production asymmetric JWT signing (adapters may hand claims to a platform KMS
# instead; PyJWT is the local/dev signer).
jwt = ["pyjwt[crypto]>=2.8"]
dev = ["pytest>=7", "ruff>=0.4", "pyjwt[crypto]>=2.8"]

[project.urls]
Homepage = "https://github.com/vijayvedula/warden"
Repository = "https://github.com/vijayvedula/warden"

[tool.hatch.build.targets.wheel]
packages = ["warden_sdk"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
