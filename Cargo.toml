[package]
# `warden` and `warden-core` are both taken on crates.io by an unrelated database-migration
# tool, so the published package is `warden-agent`. The family names itself by layer —
# warden-agent gates *actions*, warden-connect gates *connections* — and warden-delegate and
# warden-trace are reserved for the same reason.
name = "warden-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "An action control plane for AI agents: gate, record, and approve MCP tool calls with a tamper-evident audit chain."
license = "LicenseRef-FSL-1.1-ALv2"
repository = "https://github.com/vijayvedula/warden"
homepage = "https://github.com/vijayvedula/warden"
readme = "README.md"
keywords = ["mcp", "ai-agents", "policy", "audit", "authorization"]
categories = ["command-line-utilities", "authentication"]
exclude = ["/docs", "/examples", "/fixtures", "/fuzz", "/sdk", "/.github"]

# The library keeps the name `warden`, independently of the package. That is what makes the
# rename cost nothing: `use warden::Gateway` still compiles here in `main.rs` and in every
# dependent, because rustc takes the extern crate name from the lib TARGET, not the package.
[lib]
name = "warden"
path = "src/lib.rs"

# And the binary is still `warden`, so `cargo install warden-agent` installs a `warden`
# command. A user types the product's name; the registry entry is a packaging detail.
[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
toml = "0.8"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["use_pem", "rust_crypto"] }
libc = "0.2.186"
base64 = "0.22.1"
ureq = "3.3.0"
